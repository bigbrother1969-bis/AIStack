    points: 10
  - domain: Services
    points: 15
  - domain: Sauvegarde / PRA
    points: 25
  - domain: GPU
    points: 8
  - domain: Tests PRA
    points: 25
  - domain: État persistant
    points: 25
  - domain: Écarts d'inventaire
