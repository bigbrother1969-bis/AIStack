# AIStack — the AI the troubleshooting assistant asks for its opinion.
#
# Google Gemini first, when its key is set (`gemini.api_key_env`, entered
# in /setup or Settings → API keys): the question and its facts then
# leave the local network, and the page says so before the click. The
# local model of Ollama (`host`, `port`, `model`) answers when Gemini is
# not set or does not answer — `127.0.0.1`, since Ollama listens on the
# loopback only and AIStack runs on the host's network. `timeout`: how
# long, in seconds, a local answer may take. Remove the `gemini` block
# to keep every question on this server.

host: 127.0.0.1
port: 11434
model: qwen2.5:3b
timeout: 900
translator_model: null
gemini:
  model: gemini-3.5-flash-lite
  api_key_env: AISTACK_GEMINI_API_KEY
  timeout: 60
