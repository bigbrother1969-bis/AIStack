  #
  # **0.3.0 — published 2026-09-03.**
  #
  #   bigbrother1969/aistack-core:0.3.0
  #   @sha256:55f9cd02711462306eb434a6c4184936b7a7fa1a28ddc7f374bea2248fde0376
  #
  # Built from 7fab030 on the reference host, behind the four terms
  # OPS-0002 § *Publishing an image* requires: a clean tree, `main`,
  # HEAD equal to origin/main, and 823 tests with `clean: True`.
  # 66 artifacts, 16 checks. Freezes the resource-priority monitor
  # (`claude/PLAN-RESOURCE-PRIORITY-2026-09-03.md`) and the Selection
