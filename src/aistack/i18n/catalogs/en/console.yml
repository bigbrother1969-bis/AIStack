  director: "Publication director: {director}."
  contact: "Contact: through the website {contact_url}."
  hosting_heading: "Hosting"
  hosting_text: "This site is self-hosted on a server owned by the publisher, in France."
  data_heading: "Personal data and cookies"
  data_text: "This console asks for no account and collects no personal data through any form. It sets a single, strictly functional cookie that remembers the chosen language; no audience measurement or advertising tool is used. Like any web server, this one records the requests it receives (IP address, requested page, date) in its system log, for its operation and security."
