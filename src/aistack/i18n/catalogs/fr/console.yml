  title: "Aide"
  intro: "Cette page explique comment lire la console et à quoi sert chacun des écrans qu'elle relie."
  health_heading: "L'état de santé"
  health_text: "Le cadre du haut résume la dernière mesure du Cockpit Santé. Le score sur 100 combine les domaines mesurés (stockage, services, sauvegardes, GPU, tests de restauration, état persistant, écarts d'inventaire), chacun pondéré selon OPS-0008. La dette technique compte les constats qui restent à traiter : plus elle est basse, plus il y en a."
  badges_heading: "Les pastilles des domaines"
  badges_text: "Une pastille verte signale un domaine sans constat. Une pastille rouge signale au moins un constat : un clic ouvre son détail dans le Cockpit Santé, d'où l'assistant de pannes peut accompagner sa correction. Une pastille grise signale un domaine qui n'est pas mesuré sur cet hôte."
  screens_heading: "Les écrans"
  screens_text: "Les cartes sont regroupées en deux familles. Celles du réseau local (bordure bleu-gris) ne répondent qu'à la maison : elles montrent l'historique de l'infrastructure ou agissent sur elle. Celles d'internet (bordure dorée) sont consultables de partout."
  language_heading: "La langue"
  language_text: "Les drapeaux changent la langue de toutes les pages ; la page Paramètres permet de la choisir explicitement. Le choix est mémorisé dans ce navigateur par un seul cookie, sans autre usage."
  back: "← Retour à la console"
