  page_title: "AIStack — Help"
  title: "Help"
  intro: "This page explains how to read the console and what each screen it links to is for."
  health_heading: "Health"
  health_text: "The top frame summarises the Health cockpit's latest measurement. The score out of 100 combines the measured domains (storage, services, backups, GPU, restore tests, persistent state, inventory gaps), each weighted per OPS-0008. Technical debt counts the findings still to be handled: the lower it is, the more there are."
  badges_heading: "Domain badges"
  badges_text: "A green badge marks a domain with no finding. A red badge marks at least one finding: a click opens its detail in the Health cockpit, from where the troubleshooting assistant can guide its fix. A grey badge marks a domain not measured on this host."
  screens_heading: "Screens"
  screens_text: "Cards come in two families. Local-network cards (blue-grey edge) only answer at home: they show the infrastructure's history or act on it. Internet cards (gold edge) can be read from anywhere."
  language_heading: "Language"
  language_text: "The flags change the language of every page; the Settings page lets you choose it explicitly. The choice is remembered in this browser by a single cookie, used for nothing else."
  back: "← Back to the console"
