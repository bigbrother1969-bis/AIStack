# AIStack — the health score's weights (OPS-0008): how many points each
# domain of the health cockpit carries in the score out of 100. A
# domain with nothing to measure on this installation counts for
# nothing.

weights:
  - domain: Stockage
    points: 10
  - domain: Services
    points: 15
  - domain: Sauvegarde / PRA
    points: 25
  - domain: GPU
    points: 8
  - domain: Tests PRA
    points: 25
  - domain: État persistant
    points: 25
  - domain: Écarts d'inventaire
    points: 25
  - domain: Hôtes
    points: 15
  - domain: Données d'AIStack
    points: 10
