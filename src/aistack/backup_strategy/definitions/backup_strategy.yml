# Backup strategy declarations — OPS-0010's own declared values.
#
# Loaded by `load_backup_strategy_yaml`
# (`src/aistack/backup_strategy/yaml/store.py`), read by
# `aistack.cli.health_render` and `aistack.cli.console_render`
# (domain "État persistant").
#
# Declared 2026-09-30, 1.6 tranche 2 (R9): the owner chose "le stock
# déjà réel" as this domain's scope — the services already named in
# this session's own real PRA history (`pra_tests.yml`, `OPS-0009`)
# rather than the ~60 services `service_categorization.yml` lists,
# most of which have never had a backup mechanism cited for them at
# all. `service_categorization.yml`'s own ~50 remaining services stay
# out of this file until the owner cites a real backup mechanism for
# one of them (`ARC-P-006`) — not a silent narrowing, a declared one.
#
# This file is edited by hand — no UI writes it back, the same
# convention `pra_tests.yml`/`backup_thresholds.yml` already hold.
#
# **Three real engines, not an abstract taxonomy** (see
# `aistack.contracts.backup_strategy_declaration` for the full
# grounding): `dump_sql` (a live database dumped without stopping the
# service), `stop_and_archive` (the service stopped, archived,
# restarted), `live_file_backup` (plain files backed up while the
# service keeps running, no stop, no dump).
#
# **`wordpress`** — GIGABYTE. `/srv/scripts/backup-wordpress.sh`:
# `mysqldump` of the WordPress database plus a `tar` of `wp-content`,
# both taken live (no container stop). Already the basis of
# `backup_thresholds.yml`/`OPS-0006`'s own freshness check — this file
# adds the mechanism, that one the freshness threshold, on the same
# real script.
#
# **`arrstack`** — GIGABYTE. `/srv/scripts/backup-arrstack.sh`: stops
# every arrstack container (`docker compose stop`), `tar czf`s
# `/srv/arrstack/configs`, restarts them. The clean single-engine
# example (`claude/SESSION-2026-09-26-pra-arrstack-restore-test.md`).
#
# **`changedetection`/`homepage`/`npm`/`pocketid`/`uptime-kuma`/
# `vaultwarden`** — Raspberry. `/usr/local/bin/backup_raspberry.sh`:
# a restic snapshot of each stack's files, taken live (no stop) —
# acceptable for these six because each holds its state in a SQLite
# file restic captures whole, not a live multi-file database engine
# (`claude/SESSION-2026-09-26-pra-raspberry-restore-test.md`).
#
# **`vikunja`** — Raspberry. Same script, extended 2026-09-26: its
# files (`/srv/vikunja/files`) go through the same restic snapshot as
# the six services above (`live_file_backup`), but its live MariaDB
# data directory (`/srv/vikunja/db`) is never captured directly — a
# `mariadb-dump --single-transaction` against the `vikunja-db`
# container runs first, writing to `/srv/vikunja/db_dump`, which is
# what actually gets backed up (`dump_sql`). Both engines are real and
# confirmed by a real restore test the same day (34 tables restored
# into a scratch MariaDB container).
#
# **`nextcloud`/`immich`** — GIGABYTE. 1.6 closure, 2026-10-02: the
# 2026-09-11 note's "timers systemd" is real, found by the owner —
# `backup-nextcloud-db.timer`/`.service` (daily, 02:20) and
# `backup-immich-db.timer`/`.service` (daily, 02:40), each a `oneshot`
# calling a dedicated script (`dump_sql`, same shape as
# `backup-wordpress.sh`): `mariadb-dump --single-transaction --quick`
# for Nextcloud, `pg_dump` for Immich, both gzipped into
# `/media/BACKUP/SQL_BACKUPS/<service>/`, 30-day retention. **The
# literal command in each script carries a live database root
# password in clear text — not reproduced here or anywhere in this
# repository**, this file states the command's shape, never the
# credential (same discipline `SESSION-2026-09-26-pra-raspberry-
# restore-test.md` § *Étape 4* already held for Raspberry's restic
# password). Each service's own files (uploads, photo library) are
# covered separately by Deja Dup (GUI over Duplicity) — owner-stated,
# 2026-10-02 (`live_file_backup`); no script to grep for a GUI tool,
# the same "owner states it, this type carries what was stated"
# (`GOV-P-001`) `BackupStrategyDeclaration`'s own docstring already
# names as valid grounding for a declaration like this one.
#
# **`gigabyte`** — the host itself, distinct from the services that
# run on it (`wordpress`, `arrstack`): its own system-level state (OS,
# configuration not captured by any app-level backup above). 1.6
# closure, 2026-10-02: owner-stated — regular Clonezilla disk images,
# taken with the host booted into rescue media for the duration of the
# image (`stop_and_archive`: the host itself stopped, archived,
# restarted, the same shape `backup-arrstack.sh` already holds at
# service scale). Frequency and the Clonezilla version used are not
# declared here — the owner mentioned a procedure documenting the
# version should exist but did not locate it in this session; add it
# here once found, never guessed meanwhile. `pra_tests.yml` still
# declares `gigabyte.last_test: null` — a real mechanism existing is
# not itself a passed restore test (`ARC-P-006`): the 2026-09-27
# Clonezilla refresh mentioned in `claude/SESSION-2026-09-26-pra-
# raspberry-restore-test.md` was never followed by a confirmed restore
# test in this heritage's own history.

services:
  - name: wordpress
    host: GIGABYTE
    has_state: true
    engines: [dump_sql]
    mechanism: >-
      /srv/scripts/backup-wordpress.sh — mysqldump de la base
      WordPress + tar de wp-content, à chaud (pas d'arrêt de
      conteneur)
  - name: arrstack
    host: GIGABYTE
    has_state: true
    engines: [stop_and_archive]
    mechanism: >-
      /srv/scripts/backup-arrstack.sh — arrêt des conteneurs arrstack
      (docker compose stop), tar czf de /srv/arrstack/configs,
      redémarrage
  - name: nextcloud
    host: GIGABYTE
    has_state: true
    engines: [dump_sql]
    mechanism: >-
      backup-nextcloud-db.timer (quotidien, 02:20) →
      /usr/local/sbin/backup_nextcloud_db.sh — docker exec nc_db
      mariadb-dump --single-transaction --quick --databases nextcloud,
      gzippé dans /media/BACKUP/SQL_BACKUPS/nextcloud, rétention 30
      jours (dump_sql) ; les fichiers, voir nextcloud-files
  # Corrected 2026-10-08 (1.9, sandbox cadrage, owner's decision): the
  # files were declared covered by Deja Dup on 2026-10-02. Measured on
  # GIGABYTE that day: nc_app mounts /media/BACKUP/nextcloud/data
  # (/var/www/html) and /media/BACKUP/nextcloud/data_directory (the
  # user data) — on the backup disk itself, the Raspberry's NFS share —
  # and Deja Dup's include-list (/media/BD/BD, /media/BD/Books,
  # /media/Films/Mangas, /media/Documents, /media/Multimedia,
  # /media/Comics/Comics, /media/freebox) names neither. One copy, no
  # backup: stated as such until a real copy exists elsewhere.
  # Owner, 2026-10-08: no disk is available for a copy of this size —
  # the risk is known and kept, to be fixed later; the finding stays on
  # the Health page until then.
  - name: nextcloud-files
    host: GIGABYTE
    has_state: true
    engines: []
    mechanism: >-
      aucun — /media/BACKUP/nextcloud/data et
      /media/BACKUP/nextcloud/data_directory sont sur le disque de
      sauvegarde lui-même (partage NFS du Raspberry) et Deja Dup ne
      les copie pas : une seule copie
  - name: immich
    host: GIGABYTE
    has_state: true
    engines: [dump_sql, live_file_backup]
    mechanism: >-
      backup-immich-db.timer (quotidien, 02:40) →
      /usr/local/sbin/backup_immich_db.sh — docker exec immich_postgres
      pg_dump -U postgres -d immich, gzippé dans
      /media/BACKUP/SQL_BACKUPS/immich, rétention 30 jours (dump_sql) ;
      bibliothèque externe /media/Multimedia/Photos (montée en
      /external/photos) copiée par Deja Dup dans
      /media/BACKUP/GIGABYTE_DAILY, non chiffrée (live_file_backup) ;
      les photos téléversées, voir immich-uploads
  # Corrected 2026-10-08, same measurement: UPLOAD_LOCATION is
  # /media/BACKUP/immich (mounted at /data in immich_server) — the
  # backup disk itself, outside Deja Dup's include-list. Only the
  # external library (/media/Multimedia/Photos) is really copied.
  # Owner, 2026-10-08: no disk available yet — known risk, kept, to be
  # fixed later (same as nextcloud-files).
  - name: immich-uploads
    host: GIGABYTE
    has_state: true
    engines: []
    mechanism: >-
      aucun — UPLOAD_LOCATION=/media/BACKUP/immich est sur le disque de
      sauvegarde lui-même (partage NFS du Raspberry) et Deja Dup ne le
      copie pas : une seule copie
  - name: gigabyte
    host: GIGABYTE
    has_state: true
    engines: [stop_and_archive]
    mechanism: >-
      Image disque Clonezilla, hôte démarré en mode secours le temps
      de l'image puis redémarré normalement, déclaré par le owner ;
      fréquence et version Clonezilla non précisées dans ce dépôt
  - name: changedetection
    host: raspberry
    has_state: true
    engines: [live_file_backup]
    mechanism: >-
      /usr/local/bin/backup_raspberry.sh — snapshot restic des
      fichiers du stack, à chaud
  - name: homepage
    host: raspberry
    has_state: true
    engines: [live_file_backup]
    mechanism: >-
      /usr/local/bin/backup_raspberry.sh — snapshot restic des
      fichiers du stack, à chaud
  - name: npm
    host: raspberry
    has_state: true
    engines: [live_file_backup]
    mechanism: >-
      /usr/local/bin/backup_raspberry.sh — snapshot restic des
      fichiers du stack, à chaud
  - name: pocketid
    host: raspberry
    has_state: true
    engines: [live_file_backup]
    mechanism: >-
      /usr/local/bin/backup_raspberry.sh — snapshot restic des
      fichiers du stack, à chaud
  - name: uptime-kuma
    host: raspberry
    has_state: true
    engines: [live_file_backup]
    mechanism: >-
      /usr/local/bin/backup_raspberry.sh — snapshot restic des
      fichiers du stack, à chaud
  - name: vaultwarden
    host: raspberry
    has_state: true
    engines: [live_file_backup]
    mechanism: >-
      /usr/local/bin/backup_raspberry.sh — snapshot restic des
      fichiers du stack, à chaud
  - name: vikunja
    host: raspberry
    has_state: true
    engines: [dump_sql, live_file_backup]
    mechanism: >-
      /usr/local/bin/backup_raspberry.sh — mariadb-dump
      --single-transaction de vikunja-db vers /srv/vikunja/db_dump
      (dump_sql), snapshot restic de /srv/vikunja/files
      (live_file_backup) ; /srv/vikunja/db lui-même n'est jamais
      capturé directement
  # AIStack itself (1.9, decided by the owner 2026-10-05; roadmap R4,
  # ADR-0011 § 11): its data, its declarations and its environment.
  - name: aistack
    host: GIGABYTE
    has_state: true
    engines: [dump_sql, live_file_backup]
    mechanism: >-
      scripts/backup_aistack.sh, lancé par aistack-backup.timer
      (quotidien, 03:00) — copie cohérente de la base des sessions par
      l'API de sauvegarde de SQLite (dump_sql), archive à chaud des
      historiques, explications, pages générées, de ./config et des
      fichiers .env (live_file_backup), dans /media/BACKUP/AIStack,
      droits 600, rétention 30 jours ; le graphe de la Time Machine
      n'est pas sauvegardé, il se reconstruit (timemachine_rebuild)
