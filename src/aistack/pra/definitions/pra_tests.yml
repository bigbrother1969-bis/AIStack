# PRA (restore) test records — OPS-0009's own declared values.
#
# Loaded by `load_pra_tests_yaml` (`src/aistack/pra/yaml/store.py`),
# read by `aistack.cli.health_render` and `aistack.cli.console_render`.
#
# Declared 2026-09-23 by the owner (`PLAN-J11` § 11.9.1, third and
# last named gap, reopened the same day
# `claude/PLAN-CMDB-HTTP-PROBE-2026-09-23.md` and
# `claude/PLAN-TECHNICAL-DEBT-CARD-2026-09-23.md` closed the first
# two): the five services already named in the legacy
# `homelab_documentation` engine's own restore procedures
# (`procedures/restore_*.md` — gigabyte, raspberry, nextcloud, immich,
# arrstack), and a 90-day freshness threshold applied to all five
# alike (a quarterly rhythm, the owner's own choice over a looser
# 180-day alternative examined with her).
#
# `nextcloud` and `immich`'s `last_test` entries are the owner's own
# real restore-test history, found 2026-09-23 in the legacy engine's
# `runtime/pra_tests.json` (a real, hand-maintained record — not
# invented for this file) and carried over here rather than reset to
# untested. `gigabyte`, `raspberry` and `arrstack` have never been
# tested in that history either, and are declared here the same
# honest way: `last_test: null`, not a fabricated one.
#
# This file is edited by hand after each real restore test — no UI
# and no provider writes it back, the same convention
# `backup_thresholds.yml` already holds.
#
# **`arrstack` recorded as `failed`, 2026-09-26.** The owner ran a
# real restore attempt against `/srv/arrstack/configs` from the
# GIGABYTE Duplicity archive (`/media/BACKUP/GIGABYTE_DAILY`) —
# `duplicity restore --path-to-restore srv/arrstack/configs ...`
# returned "not found in archive - no files restored." A second,
# read-only check (`duplicity list-current-files ... | grep
# arrstack`) confirmed it: nothing under `arrstack` is in that
# archive at all. The owner then identified that archive as his own
# weekly Deja Dup backup of GIGABYTE — Deja Dup being a GUI over
# Duplicity — configured to cover his personal document/media
# folders, not `/srv`. So this is a real, confirmed gap, not a typo
# in the restore command: Arrstack's configuration currently has no
# working backup anywhere this owner could find. No `rto_minutes` —
# nothing was actually restored, so there is no recovery time to
# report.
#
# **`arrstack` corrected to `success`, same day (2026-09-26).** The
# owner closed the gap above the same day it was found:
# `/srv/scripts/backup-arrstack.sh` (a dedicated backup, kept separate
# from Deja Dup rather than added into it — the same pattern
# `backup-wordpress.sh` and the Nextcloud/Immich SQL dumps already
# use) stops every arrstack container, `tar czf`s
# `/srv/arrstack/configs` to `/media/BACKUP/CONFIG_BACKUPS/arrstack/`,
# restarts them, and keeps the last 8 archives — scheduled weekly
# (`15 3 * * 0`, root's crontab). A real restore test followed:
# extracting the freshly produced archive to a scratch directory and
# diffing it against the live tree. That diff is not empty — but
# every difference is exactly what a stack that was stopped for the
# backup and then restarted and left running produces on its own
# (WAL/SHM journal sidecars, `.pid` files from the new process,
# growing logs, in-flight crash-report files) — nothing pointing at a
# failed or truncated extraction. `tar -xzf` itself completed cleanly
# in 3m10.7s real time with no warnings, unlike the first attempt at
# building this backup (`lidarr.db: file changed as we read it`,
# fixed by stopping the containers first). `rto_minutes: 3`, rounded
# down from that measured 3m10.7s — the field is declared as an
# integer, this file states the real number it was rounded from
# rather than a false extra digit of precision.

max_age_days: 90

services:
  - name: gigabyte
    last_test: null
  - name: raspberry
    last_test: null
  - name: nextcloud
    last_test:
      status: success
      date: "2026-06-24"
      rto_minutes: 2
  - name: immich
    last_test:
      status: success
      date: "2026-06-24"
      rto_minutes: 5
  - name: arrstack
    last_test:
      status: success
      date: "2026-09-26"
      rto_minutes: 3
