# AIStack — GPU consumption thresholds (OPS-0007).
#
# Per host (`host`: its name as `hostname` prints it; "*": any host the
# file does not name): temperature, utilisation and memory, read with
# nvidia-smi. A host without an NVIDIA GPU is simply not measured.

hosts:
  - host: "*"
    thresholds:
      - kind: temperature_celsius
        celsius: 80
      - kind: utilization_percent
        percent: 90
      - kind: memory_percent
        percent: 90
