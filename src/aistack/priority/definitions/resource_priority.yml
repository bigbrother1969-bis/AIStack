# Resource priority definition — priority apps vs. background containers.
#
# Loaded by `load_resource_priority_yaml`
# (`src/aistack/priority/yaml/store.py`), and read by the étape 4
# monitor (`aistack.cli.resource_priority_monitor`). Decisions taken
# with the owner on 2026-09-03
# (`claude/PLAN-RESOURCE-PRIORITY-2026-09-03.md`); measured live
# against GIGABYTE the same day.
#
# **Reshaped 2026-09-03, same day, to a generic
# priority-list/detector-abstraction form** —
# `claude/PLAN-DYNAMIC-CONTAINER-PRIORITY-2026-09-03.md`. `jellyfin:`
# (a single named block) became one entry of `priority:` (a list),
# so a second priority app can be added — through the new
# `priority_ui` screen, or by hand — without this file's shape
# changing again. Only one priority app exists today; nothing below
# is hypothetical, it is what GIGABYTE actually runs.

priority:
  - container: jellyfin
    # Already configured today (decision baseline, confirmed live via
    # `docker inspect`: NanoCpus=3000000000).
    normal_cpus: 3
    # The machine's full 4 cores (`nproc`) while a session plays —
    # decision #6: the cores freed by throttling the background
    # containers have to go somewhere.
    boosted_cpus: 4
    detector:
      type: jellyfin
      # The monitor runs on the host (decided 2026-09-03), same as
      # the Selection UI — the host-published address, not the
      # Docker-internal one confirmed the same day.
      url: http://127.0.0.1:8096
      # Never the key itself — GOV-P-001, same convention as
      # SYNCTHING_API_KEY. The owner created a key named "AIStack"
      # in Jellyfin's own Dashboard → Clés API, 2026-09-03.
      api_key_env: JELLYFIN_API_KEY
      timeout_seconds: 5

# The host's own core count (`nproc`, measured 2026-09-03) — not a
# policy choice. Docker cannot clear a CPU limit once one has been
# set (verified live building the apply layer, étape 3b); restoring
# "unlimited" is written as a cap at every core the host has, which
# is operationally the same thing.
unlimited_cpus: 4

# Decision of 2026-09-03 (the original build) — long enough to
# absorb a bathroom break or a phone call without the background
# containers being unbridled and rebridled minutes apart; short
# enough that closing a priority app for the night gives them the
# machine back inside a minute, not after it. Moved here from a
# monitor constant the same day this file gained a `priority:` list,
# since it was already the owner's own decision.
grace_seconds: 60

background:
  # Decision #7 — one shared throttled ceiling, not a per-container
  # value: enough to stay alive and answer, little enough to barely
  # contest a priority app on a 4-core machine.
  default_throttled_cpus: 0.1

  # Decision #5 — the eleven containers measured with no CPU limit
  # at all, plus seerr, mularr and komf. Membership here is now an
  # owner decision made through `priority_ui`
  # (`claude/PLAN-DYNAMIC-CONTAINER-PRIORITY-2026-09-03.md`, decision
  # 3: anything Docker reports that is not classified here or in
  # `priority` above is left alone entirely), not a hardcoded list a
  # code change was required to revise — this is simply what that
  # decision currently reads as, unchanged from the original build.
  containers:
    - name: radarr
    - name: sonarr
    - name: lidarr
    - name: readarr
    - name: mylar3
    - name: bazarr
    - name: prowlarr
    - name: autobrr
    - name: qbittorrent
    - name: gluetun
    - name: unpackerr
    - name: seerr
    - name: mularr
    - name: komf
      # Exception to the rest of this list: already limited to 0.5
      # CPU today (confirmed live via `docker inspect`,
      # 2026-09-03) — "normal" restores that value, not "no limit".
      normal_cpus: 0.5
