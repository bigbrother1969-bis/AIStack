# AIStack — restore tests (PRA): per service, the last time its restore
# was tested, and how it went. A test older than `max_age_days` is due.
# Recorded from the troubleshooting assistant, or by the scheduled
# restore tests (`sandbox.yml`); nothing is declared on a new
# installation. For instance:
#
#   services:
#     - name: nextcloud
#       last_test:
#         status: success
#         date: "2026-10-08"
#         rto_minutes: 5

max_age_days: 90
services: []
