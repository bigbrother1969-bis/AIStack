<!doctype html>
<html lang="{{ lang }}">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('auth.title') }}</title>
  <style>{% include "auth/_style.html" %}</style>
</head>
<body>

</body>
</html>
