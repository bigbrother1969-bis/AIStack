# Gap #3, added 2026-10-02 — a contained slice, read-only, one subject
# (see app.py's own `_reconstitution`). Never a then/now comparison,
# never a real restore: ADR-0011 § Decision 10 ("read-only, never a
# writer") forbids it.
reconstitute:
  heading: "Reconstitution"
  intro: "For a chosen subject and instant, what is known on each stream at or before that instant — never a comparison between two instants, never a real restore: AIStack never touches the real container from this screen."
  subject_label: "Subject:"
  as_of_label: "At or before:"
  missing: "Pick a subject and an instant first, from the tree or the ribbon."
  empty_streams: "No stream known for this subject."
  no_observation: "No observation known at or before this instant, for this stream."
  view_node: "View this node"
# Gap #2 (2026-10-02), then 1.7 tranche 4 (ADR-0015): an
# administrator writes, validates or discards; the graph sees it at
# the next `timemachine_rebuild`.
