# "Start-up checks" screen and the cartouche indicator (ADR-0032).

title: "AIStack — Start-up checks"
heading: "Start-up checks"
meta: "The controls you used to run by hand after a reboot, run by AIStack and judged by code against what boot_checks.yml declares. Read-only: nothing here changes the host."
indicator:
  label: "Start"
  label_host: "Start of {host}"
  ok: "{label}: all well for {elapsed}"
  ok_partial: "{label}: all well for {elapsed} ({skipped} not declared)"
  pending: "{label}: being checked ({elapsed})"
  warning: "{label}: {count} to watch (since {elapsed})"
  critical: "{label}: {count} to fix (since {elapsed})"
  unknown: "{label}: not judged"
  title_ok: "Every control passes now. The host started {elapsed} ago."
  title_partial: "Every control that is declared passes now; {skipped} control(s) have nothing declared to compare with and are not checked. The host started {elapsed} ago."
  title_pending: "The host started {elapsed} ago and the checks wait for the containers to come up."
  title_anomaly: "The host started {elapsed} ago. Open the start-up checks for the controls that fail."
  title_unknown: "The checks could not judge the start: {note}"
elapsed:
  days: "{d} d {h} h"
  hours: "{h} h {m}"
  minutes: "{m} min"
summary:
  heading: "Now"
  overall: "Overall"
  started: "Started"
  since: "Time since the start"
  checked: "Last check"
  anomalies: "Anomalies"
  none: "No verdict yet: the checks have not run, or the host unit has not written its facts."
status:
  ok: "passes"
  pending: "waiting"
  warning: "to watch"
  critical: "to fix"
  skipped: "not checked"
  unknown: "not read"
  information: "information"
overall:
  ok: "all well"
  pending: "being checked"
  warning: "to watch"
  critical: "to fix"
  unknown: "not judged"
host:
  heading: "Machine {host}"
controls:
  extra: "extra"
  heading: "Controls"
  control: "Control"
  status: "Result"
  detail: "Detail"
  technical: "The sentences are the program's own, in English; the names are those of your host."
  skipped_hint: "A control marked not checked has nothing declared to compare with: declare it in boot_checks.yml (python -m aistack.cli.boot_check --suggest prints what the facts say)."
control:
  failed_units: "Failed units"
  mounts: "Mounts"
  reachable: "Reachable"
  monitor: "Uptime Kuma monitors"
  database_recovery: "Database recovery"
  kernel_disk_errors: "Kernel disk errors"
  restart_cause: "Cause of the previous stop"
  backup_after_restart: "Backup after the restart"
  memory: "Memory and swap"
