  already_background: "{subject} était déjà classé « background » dans resource_priority.yml — rien à écrire."
  added: "{subject} ajouté à background.containers dans resource_priority.yml (ralenti partagé : {cpus} CPU dès que le moniteur resource-priority tourne)."
help:
  title: "AIStack — Aide : terminal et SSH"
  back: "← Retour à l'assistant de pannes"
  heading: "Ouvrir un terminal et se connecter en SSH"
  intro: "Un petit aide-mémoire, écrit à la main — pas généré par l'IA, pour ne rien risquer d'inventer (les commandes exactes viennent d'un vrai usage observé pendant les sessions AIStack précédentes)."
  terminal_heading: "1. Ouvrir un terminal sur ton ordinateur"
  terminal_before: "Sous Linux, le raccourci"
  terminal_after: "ouvre un terminal sur la plupart des environnements de bureau (dont Cinnamon, utilisé par Linux Mint). S'il ne fait rien sur ta machine, cherche « Terminal » dans le menu des applications."
  find_heading: "2. Trouver GIGABYTE sur ton réseau local"
  find_address: "Adresse observée pendant cette session :"
  find_note_before: "Cette adresse peut changer si ta box réattribue les adresses (DHCP) — ce n'est pas garanti à vie. Si elle ne répond plus, essaie d'abord le nom"
  find_note_after: "à la place de l'adresse ; sinon, consulte la liste des appareils connectés dans l'interface de ta box/routeur."
  ssh_heading: "3. Se connecter en SSH"
  ssh_from: "Depuis le terminal ouvert à l'étape 1 :"
  ssh_replace_before: "(remplace l'adresse par celle que tu as retrouvée à l'étape 2 si elle a changé, ou essaie"
  ssh_replace_middle: "). Le mot de passe du compte"
  ssh_replace_after: "sur GIGABYTE est ensuite demandé — rien ne s'affiche à l'écran pendant que tu tapes, c'est normal en SSH, pas un bug."
  paste_heading: "4. Copier-coller une commande"
  paste_before: "Pour coller dans la plupart des terminaux Linux :"
  paste_keys: "Ctrl+Maj+V"
  paste_middle: "(le"
  paste_after: "seul ne colle généralement pas dans un terminal — il tape parfois un caractère à la place). Sinon, un clic droit propose souvent « Coller » directement."
  copy_before: "Pour copier : sélectionne le texte à la souris, puis"
  copy_keys: "Ctrl+Maj+C"
  copy_after: ", ou clic droit → « Copier »."
