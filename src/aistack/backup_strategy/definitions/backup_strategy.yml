# AIStack — how each service with state is backed up (OPS-0010): per
# service, its `host`, whether it `has_state`, the `mechanism` and the
# `engines` (databases) it holds. Read by the health cockpit's
# "Backup / PRA" domain and by the restore tests. Nothing is declared
# on a new installation; for instance:
#
#   services:
#     - name: nextcloud
#       host: server
#       has_state: true
#       mechanism: nightly database dump and file copy to /media/Backup
#       engines: [mariadb]

services: []
