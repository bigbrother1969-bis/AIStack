# AIStack — the AI the troubleshooting assistant asks for its opinion.
#
# Google Gemini first, when its key is set (`gemini.api_key_env`, entered
# in /setup or Settings → API keys): the question and its facts then
# leave the local network, and the page says so before the click. The
# local model of Ollama (`host`, `port`, `model`) answers when Gemini is
# not set or does not answer — `127.0.0.1`, since Ollama listens on the
# loopback only and AIStack runs on the host's network. `timeout`: how
# long, in seconds, a local answer may take. Remove the `gemini` block
# to keep every question on this server.
#
# Several local engines, asked in this order (the first that answers wins,
# and an answer says which model gave it): add `engines:` below. `kind` is
# `ollama` or `openai_chat` (POST /v1/chat/completions, e.g. the llama-server
# of the Olala fork); `reasoning_effort` (disabled, low, medium, high) and
# `label` are optional, and so is `temperature` (0 to 2, `openai_chat` only: lower
# answers more steadily than the model card's 0.8) and `max_tokens`
# (`openai_chat` only; 800 by default without reasoning: a looping answer is stopped). Without `engines:`, the one Ollama above answers.
#
# engines:
#   - {kind: openai_chat, host: 127.0.0.1, port: 8080, model: olala-mini-7a1b, reasoning_effort: disabled, temperature: 0.3, label: Olala}
#   - {kind: ollama, host: 127.0.0.1, port: 11434, model: qwen2.5:7b}

host: 127.0.0.1
port: 11434
model: qwen2.5:3b
timeout: 900
translator_model: null
gemini:
  model: gemini-3.5-flash-lite
  api_key_env: AISTACK_GEMINI_API_KEY
  timeout: 60

# Other outside engines, asked after Gemini in this order (Gemini, ChatGPT, Claude: the first that
# answers wins), only when declared here, their key is set (Settings, API keys) and the caller is
# `external_allowed` in ai_policy.yml. The question and its facts leave your network. `model` is
# the name your account offers; `timeout` and (Claude only) `max_tokens` are optional.
#
# openai:
#   model: <a model of your OpenAI account>
#   api_key_env: AISTACK_OPENAI_API_KEY
# anthropic:
#   model: <a model of your Anthropic account>
#   api_key_env: AISTACK_ANTHROPIC_API_KEY
#   max_tokens: 1024
