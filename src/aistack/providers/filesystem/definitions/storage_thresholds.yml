# AIStack — storage capacity thresholds (OPS-0005).
#
# Per host (`host`: its name as `hostname` prints it; "*": any host the
# file does not name), per mount point: `free_bytes` (`free_gb`, room
# left) or `percent_used` (`percent_used`, how full). A new
# installation checks the system disk only; add your data disks, for
# instance:
#
#   - host: "*"
#     thresholds:
#       - mount: /
#         kind: free_bytes
#         free_gb: 10
#       - mount: /media/Data
#         kind: percent_used
#         percent_used: 90

hosts:
  - host: "*"
    thresholds:
      - mount: /
        kind: free_bytes
        free_gb: 10
