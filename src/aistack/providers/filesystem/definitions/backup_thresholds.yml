# AIStack — backup freshness thresholds (OPS-0006).
#
# Per host (`host`: its name as `hostname` prints it; "*": any host the
# file does not name), per backup directory: the newest file in `path`
# must be at most `max_age_days` old. Nothing is declared on a new
# installation: name your backups, for instance:
#
#   hosts:
#     - host: "*"
#       thresholds:
#         - path: /media/Backup/nextcloud/
#           max_age_days: 2

hosts: []
