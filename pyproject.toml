[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aistack"
version = "0.1.0"
description = "AIStack Knowledge Operating System"
readme = "README.md"
# The interpreter AIStack is verified on.
#
# It was ">=3.11" until 2026-08-23, and three versions were
# declared supported while one was ever run — whichever the
# machine happened to have. That was not free: the contract
# inventory reported 20 orphan contracts on 3.11 and 22 on 3.12
# and 3.13, at the same commit, and it was found because two
# people ran the same command on two machines rather than
# because anything checked (GOV-0002/OS-019).
#
# 3.13 is what the published images run and what the SPOT host
# runs. Narrowing the range gives up a portability nothing
# verified, and `tests/unit/test_declared_interpreter.py` refuses
# to let the claim drift from the interpreter in use.
#
# It caught the agent within the hour. The commit that introduced
# it asserted that 3.13 was also what the owner's laptop ran —
# read off a `python3 -VV` that had in fact executed on the SPOT
# host. The laptop was 3.12, the suite went red on the machine
# that runs it, and the owner aligned the laptop to 3.13 on
# 2026-08-23 rather than widen the range back.
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
]

authors = [
    { name = "Fabrice Persiaut" }
]

license = { text = "AGPL-3.0-or-later" }

# The canonical public location of the Single Point Of Truth.
#
# This is a project fact, identical on every machine, and it is
# already published inside every Context Bundle. It is not a
# machine address: the git remote of a given clone may be a
# tunnel or a loopback, and the export refuses to publish those.
# What the governed test command needs, and did not declare.
#
# `pytest` was configured in this file — `[tool.pytest.ini_options]`
# below, carrying STD-0002's testpaths — and declared as a dependency
# nowhere. It was installed by hand on the laptop, by hand on the
# agent's container, and nothing said which version either had.
#
# ENG-TEST-0002 is C3 and promises reproducibility and deterministic
# execution. An undeclared tool cannot deliver either: two machines
# running the same governed command on the same commit could run two
# pytest versions and nothing would report it. That is the shape of
# GOV-0002/OS-019, where the same measurement gave 20 orphan contracts
# on one interpreter and 22 on another, minus the warning that caught
# it.
#
# A floor, not a pin. There is no lock file yet, so this declares what
# the suite needs rather than what one machine happens to hold —
# recorded under GOV-0002/OS-025 rather than implied.
#
# This table sits after every key of `[project]` on purpose. A TOML
# table header ends the table above it, so placing it beside
# `dependencies` moved `authors` and `license` into it. Caught by
# parsing the file rather than reading it.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://gitea.persiaut-family.fr/fabrice.persiaut/AIStack.git"

[project.scripts]
aistack = "aistack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# STD-0002 (Test Artifact Isolation) says a project's test run
# covers that project's tests and nothing else. It was enforced
# by nobody: a bare `pytest` at the repository root walked into
# `tests/item`, `tests/transaction` and `tests/evidence` — which
# belong to other work that happens to live in this tree — and
# reported 220 passing tests for a project that has 209.
#
# A number nobody can attribute is not a measurement. Declaring
# the paths makes `pytest` and `pytest tests/unit tests/integration`
# the same run, so the standard holds without anyone remembering
# it.
[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
]
