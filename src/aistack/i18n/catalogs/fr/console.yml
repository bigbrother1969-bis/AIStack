  hosting_text: "Ce site est auto-hébergé sur un serveur appartenant à l'éditeur, en France."
  data_heading: "Données personnelles et cookies"
  data_text: "Cette console ne demande aucun compte et ne collecte aucune donnée personnelle par formulaire. Elle ne dépose qu'un seul cookie, strictement fonctionnel, qui mémorise la langue choisie ; aucun outil de mesure d'audience ni de publicité n'est utilisé. Comme tout serveur web, celui-ci consigne dans son journal système les requêtes reçues (adresse IP, page demandée, date), pour son exploitation et sa sécurité."
