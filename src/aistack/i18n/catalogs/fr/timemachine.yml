# Gap #3, ajoutée 2026-10-02 — tranche contenue, lecture seule, un
# sujet (voir `app.py`'s own `_reconstitution`). Jamais une
# comparaison alors/maintenant, jamais une restauration réelle :
# ADR-0011 § Décision 10 (« read-only, jamais un writer ») l'interdit.
reconstitute:
  heading: "Reconstitution"
  intro: "Pour un sujet et un instant choisis, ce qui est connu dans chaque flux à cet instant ou avant — jamais une comparaison entre deux instants, jamais une restauration réelle : AIStack ne touche jamais au conteneur réel depuis cet écran."
