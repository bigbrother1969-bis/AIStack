# "Governed Heritage Engineering" page: the manifesto and the principles, explained.

title: AIStack — Governed Heritage Engineering
page_title: AIStack — Governed Heritage Engineering
heading: Governed Heritage Engineering
tagline: The method AIStack applies to itself before applying it to your infrastructure.
what_heading: In short
what_1: 'An infrastructure is understood and handed on only if what is known about it is a governed heritage: dated, sourced, owned, explained, never overwritten. That is Governed Heritage Engineering (GHE).'
what_2: 'A system that claims to build such a heritage for others must first govern its own. AIStack is the first to apply it: its rules, decisions and code are held to what it asks of the infrastructures it observes.'
manifesto_heading: The manifesto
manifesto_intro: 'The Sustainable Heritage Manifesto has eighteen articles. It starts from an observation: software is only the visible part of a far wider intellectual effort, and most of that knowledge disappears when people leave, documentation goes stale or technologies change. The real debt is the gradual loss of understanding. Here is each article in a sentence, with an example in AIStack where there is one.'
article_word: Article
in_aistack: 'In AIStack:'
article_01:
  number: I
  title: Knowledge Is the Primary Asset
  text: The true product of engineering is what is understood. Software, documentation, infrastructure, tests and diagrams are only representations of it.
article_02:
  number: II
  title: Understanding Precedes Implementation
  text: Code is never the starting point. Understanding produces architecture, architecture is documented, and code follows as proof that understanding has become executable.
article_03:
  number: III
  title: Architecture Organises Complexity
  text: Complexity does not go away; it is distributed. Architecture spreads it across coherent domains with explicit responsibilities and governed contracts.
article_04:
  number: IV
  title: Knowledge Shall Be Governed
  text: Without governance, knowledge is only an opinion. Each item has a single point of truth, an owner, provenance, a quality and a confidence level, a lifecycle and a history; nothing enters the heritage before it is validated.
  aistack: Each architecture decision and each declaration carries its owner, version and date, and tests check it.
article_05:
  number: V
  title: Knowledge Shall Outlive Technologies
  text: Technologies, languages and AI models change. No essential knowledge shall depend on a particular vendor, cloud, framework or model.
  aistack: The AI engines (Ollama, Olala, Gemini, ChatGPT, Claude) are declared and replaceable; the policy decides, none is wired into the code.
article_06:
  number: VI
  title: To Document Is to Engineer
  text: 'Documentation is not produced after the fact: it is engineering. It preserves reasoning, which preserves understanding, which preserves the heritage.'
article_07:
  number: VII
  title: Artificial Intelligence Is a Reasoning Tool
  text: 'AI accelerates reasoning, eases exploration, assists implementation, explains and documents. It never becomes the authority: truth remains governed.'
  aistack: The AI explains a finding and suggests what to do; nothing is applied without your click, and the policy says what may leave your machines.
article_08:
  number: VIII
  title: Data Demands Governance
  text: There is no artificial intelligence without data and no reliable data without governance. AI amplifies the quality of data; it cannot compensate for its absence.
article_09:
  number: IX
  title: Generated Artifacts Are Disposable
  text: 'A generated artifact is a product; the generator is the real asset. When an artifact needs a correction, the generator is corrected first: maintenance belongs to the source of knowledge.'
  aistack: The console, architecture and health pages are generated from the declarations; they are never edited by hand.
article_10:
  number: X
  title: Sustainable Engineering Reduces Cognitive Load
  text: People have limited memory, AIs limited context, organisations limited continuity. Understanding is therefore put in governed knowledge, not in anyone's memory.
article_11:
  number: XI
  title: Engineering Is an Act of Transmission
  text: 'Engineers do not only solve today''s problems: they let those who come after understand yesterday''s solutions. Knowledge that cannot be transmitted is incomplete.'
article_12:
  number: XII
  title: Every Recommendation Shall Be Explainable
  text: 'No recommendation appears as an unexplained conclusion: it names the observations, the evidence, the rules applied, the reasoning, the confidence and the assumptions. Reasoning itself is governed, explainable and reproducible.'
  aistack: The troubleshooting assistant first establishes the facts, then the AI's opinion; the AI engines page says, for each call, which engine answered and why.
article_13:
  number: XIII
  title: Heritage Before Performance
  text: 'Performance matters; maintainability matters more: knowledge outlives optimisations. The simplest architecture that preserves understanding is always preferred.'
article_14:
  number: XIV
  title: Sustainability Begins Before Implementation
  text: 'Industrial quality is achieved mostly upstream: in understanding, modelling, governance, architecture, documentation and explicit contracts. Code should read as already matured, not as a first attempt.'
article_15:
  number: XV
  title: Engineering Is a Permanent Discovery
  text: Everything starts with reality, which leaves evidence; evidence gives observations, observations give knowledge, knowledge gives architecture, architecture gives implementation, and implementation changes reality. Knowledge progresses in a loop.
article_16:
  number: XVI
  title: The Heritage Shall Be Able to Rebuild Itself
  text: Documentation, governance, architecture and operational understanding must make it possible to rebuild the system in a new environment. The ultimate objective is Self-Onboarding.
  aistack: The guided first start and the declarations in config/ let an installation be rebuilt on another machine.
article_17:
  number: XVII
  title: Open Knowledge Is Sustainable Knowledge
  text: 'Knowledge survives through openness: open standards, documentation, governance, formats and ecosystems. Independence from vendors is a property of sustainable engineering.'
  aistack: The code, the decisions and the principles are published, with their licence, in the repositories listed in “Licence and sources”.
article_18:
  number: XVIII
  title: Engineering Serves the Common Good
  text: Engineering favours autonomy, transparency, sustainability, explainability, transmission, interoperability and long-term preservation. Technology serves society; knowledge serves humanity.
declaration_heading: The final declaration
declaration: Software becomes obsolete, technologies evolve, artificial intelligences change, organisations transform, people leave. Knowledge is the only engineering asset capable of surviving all of these changes. Our responsibility is therefore not only to build systems, but to build a governed heritage of understanding that future generations will be able to understand, enrich, evolve and pass on in their turn.
principles_heading: The principles
principles_intro: 'The articles of the manifesto become numbered principles, which AIStack''s code cites by identifier (for instance ARC-P-006 or GOV-P-001). The registry classes them by family and by criticality: C3 is a fundamental invariant AIStack never contradicts, C2 a governed rule that evolves through explained change, C1 an adaptable operational guide.'
