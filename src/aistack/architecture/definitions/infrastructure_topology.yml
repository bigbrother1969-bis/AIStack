# AIStack — what the Architecture page draws besides the containers it
# discovers: the machines (`hardware`) and the outside services the
# installation depends on (`external_nodes`: registrar, DNS, internet
# box…). Nothing is declared on a new installation; for instance:
#
#   hardware:
#     - name: server
#       model: the motherboard or the machine
#       role: Docker host
#       os: Debian 13
#       cpu: 4 cores
#       ram: 16 GB
#       storage: 1 TB SSD
#   external_nodes:
#     - name: Registrar
#       role: Domain names
#       description: example.org is registered there.

hardware: []
external_nodes: []
