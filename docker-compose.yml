services:

  # The core image is a one-shot tool, not a service.
  #
  # Its command validates a published Context Bundle and exits:
  # 0 when the projection is sound, 1 on a blocking finding,
  # 2 when the bundle cannot be found.
  #
  # Until 2026-08-21 the command printed a line and slept for a
  # hundred hours, which is what `restart: unless-stopped` and a
  # healthcheck were written for. Replacing the command with the
  # validator made both wrong: a container that exits at once and
  # is restarted for ever is a loop, not a service.
  #
  # The image carries no bundle. Mount the one to validate:
  #
  #   docker compose run --rm aistack-core
  #
  # or point it at another projection:
  #
  #   docker run --rm -v "$PWD/context/bundles:/app/bundles:ro" \
  #     aistack/core:local \
  #     python -m aistack.cli.knowledge_integrity \
  #     /app/bundles/AIStack-Context-Bundle.zip
  #
  # ---------------------------------------------------------------
  # Published images, pinned by digest so a record is not a label
  # someone can move. OPS-0002 § *Publishing an image* governs the
  # act; this is where it is recorded.
  # ---------------------------------------------------------------
  #
  # **0.5.0 — published 2026-09-04, current.**
  #
  #   bigbrother1969/aistack-core:0.5.0
  #   @sha256:3def537335f5f9f36d2824f2c6d56e0c4f5c7232017be36b93bf78a307816896
  #
  # Built from 57290fa on the reference host, behind the four terms
  # OPS-0002 § *Publishing an image* requires: a clean tree, `main`,
  # HEAD equal to origin/main, and 940 tests with `clean: True`.
  # 66 artifacts, 16 checks. Before the build, 0.4.0 was re-verified
  # against its recorded digest (`GOV-0002/OS-047`'s own rule, applied
  # for the first time) — pull matched. Freezes the closure of the
  # eight `GOV-0002` residuals opened 2026-09-03 (OS-046, 047, 048,
  # 049, 050, 051, 053, 054), all now Resolved: `docs/99-archive` and
  # its eligibility exclusion, the Context Bundle's `repository_url`
  # (read from the archive's `manifest.json` rather than always
  # defaulting to "unknown"), three documents promoted to `Published`,
  # two Draft decisions left Draft with the reasoning recorded instead
  # of the status changed, and — the one requiring its own live
  # measurement before it could close — a named pattern for running a
  # provider CLI on a deployment host without `PYTHONPATH` set by
  # hand, verified on this same host.
  #
  # **0.4.0 — published 2026-09-03.**
  #
  #   bigbrother1969/aistack-core:0.4.0
  #   @sha256:daf46c76b309e047c8801a25857b1328c01fc69c84c25d1ac333e05c8bb2f9fb
  #
  # Built from 8757605 on the reference host, behind the four terms
  # OPS-0002 § *Publishing an image* requires: a clean tree, `main`,
  # HEAD equal to origin/main, and 853 tests with `clean: True`.
  # 66 artifacts, 16 checks. Freezes the generalized resource-priority
  # system (`claude/PLAN-DYNAMIC-CONTAINER-PRIORITY-2026-09-03.md`) —
  # dynamic Docker container discovery, pluggable per-app detectors
  # (Jellyfin playback, CPU threshold), and the priority_ui screen —
  # replacing 0.3.0's single hardcoded Jellyfin app and fourteen
  # hardcoded background containers. All three run on the host, not
  # from this image, but their governed modules under `src/aistack`
  # are part of what `pip install .` now ships.
  #
  # **0.3.0 — published 2026-09-03.**
  #
  #   bigbrother1969/aistack-core:0.3.0
  #   @sha256:55f9cd02711462306eb434a6c4184936b7a7fa1a28ddc7f374bea2248fde0376
  #
  # Built from 7fab030 on the reference host, behind the four terms
  # OPS-0002 § *Publishing an image* requires: a clean tree, `main`,
  # HEAD equal to origin/main, and 823 tests with `clean: True`.
  # 66 artifacts, 16 checks. Freezes the resource-priority monitor
  # (`claude/PLAN-RESOURCE-PRIORITY-2026-09-03.md`) and the Selection
  # UI's systemd deployment — both run on the host, not from this
  # image, but their governed modules under `src/aistack` are part of
  # what `pip install .` now ships.
  #
  # **0.2.0 — published 2026-08-29.**
  #
  #   bigbrother1969/aistack-core:0.2.0
  #   @sha256:3ee7cf1fae80cce7c84f404f5354f5edeeeddbf950e299c4a2a8dcb1f4aa194f
  #
  # Built from 0a7ec1a on the reference host, behind the four terms
  # OPS-0002 § *Publishing an image* requires: a clean tree, `main`,
  # HEAD equal to origin/main, and 668 tests with `clean: True`.
  # 66 artifacts, 16 checks.
  #
  # **0.1.0 — published 2026-08-19, deleted 2026-08-23.**
  #
  #   bigbrother1969/aistack-core:0.1.0
  #   @sha256:c8ca0fa791e63f8165910b84d913a74a4d084444680518a4a3db13aaaf6359ba
  #
  # Built from ef28e16, before a publication procedure existed. It
  # carried bytecode the heritage did not know about, and the owner
  # deleted it rather than rebuilding — GOV-0002/OS-011. **The record
  # is kept**: a register that erased what it had unpublished could
  # not show that a rule ever bound anything.
  #
  # The build command is not repeated here. It lives in OPS-0002
  # § *Publishing an image*, once, and reads the version from
  # `pyproject.toml` rather than carrying a literal — the defect
  # `src/aistack/__main__.py` carried until 2026-08-29.
  #
  # The service below builds locally instead, so a change is
  # validated before it is published.
  #
  aistack-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: aistack/core:local
    container_name: aistack-core
    volumes:
      - ./context/bundles:/app/context/bundles:ro
    restart: "no"
