[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aistack"
version = "2.0.0-rc1"
description = "AIStack Knowledge Operating System"
readme = "README.md"
# The one interpreter AIStack is verified on, the one the image runs;
# tests/unit/test_declared_interpreter.py keeps the two in step.
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    # The Time Machine's graph engine (ADR-0011). A required dependency so
    # the image is complete; verified on a CPU without AVX2.
    "pyoxigraph>=0.5.11",
    # The web application (ADR-0012). FastAPI 0.142 is where
    # `include_router` stopped copying routes into the application, which
    # tests/unit/web/test_every_route_declares_its_exposure.py relies on.
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    # Sign-in (ADR-0013): the ID token's RS256 signature is verified
    # against the provider's published keys.
    "PyJWT[crypto]>=2.15.1",
]
authors = [
    { name = "Fabrice Persiaut" }
]
license = { text = "AGPL-3.0-or-later" }

# Keep this table after every key of [project]: a table header ends the
# table above it.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "mypy>=1.20",
    "types-PyYAML>=6.0",
    # FastAPI's TestClient; `httpx2`, since Starlette warns that `httpx` is
    # deprecated for its test client.
    "httpx2>=2.13",
    # scripts/install.sh is checked by shellcheck in the suite (ADR-0023 § 4).
    "shellcheck-py>=0.10",
]

[project.urls]
Repository = "https://gitea.persiaut-family.fr/fabrice.persiaut/AIStack.git"

[project.scripts]
aistack = "aistack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Without these, `pip install .` (what the Dockerfile runs) would package
# the Python modules only: every declaration, catalog, template and
# vendored file is read from the installed package at run time.
[tool.setuptools.package-data]
aistack = ["**/*.yml", "**/*.js", "**/*.png", "**/*.svg", "**/*.html", "**/*.md"]

# `pytest`, `mypy` and `ruff check src tests` take their scope from here, so
# the commands carry no path. A path given to mypy replaces `files`.
[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
]

[tool.mypy]
python_version = "3.13"
files = ["src/aistack"]

[tool.ruff.lint]
select = ["F", "B", "RUF043"]
# B011 (`assert False`) and B024 (an ABC without abstract methods) are
# idioms the contract tests use on purpose.
ignore = ["B011", "B024"]

# FastAPI's `Form(...)` and `Query(...)` defaults are declarations, not
# mutable defaults.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "fastapi.Query"]
