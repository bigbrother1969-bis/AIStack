# AIStack — the API keys and credentials AIStack's components read from the
# environment, entered or replaced from Settings. Add one entry here for a
# new key a component reads, and Settings offers it.
#
# `name` is the environment variable the component reads; a value
# entered in Settings is kept in the data directory
# (`secrets/api_keys.json`, mode 0600) and wins over `.env.web`.
# `secret: false` is a setting shown in full (an address); every other
# value is never shown again, only its last four characters.
# `applies`: when a change is taken into account. `test`: how Settings
# checks the value (gemini, gotify, syncthing; absent: no test).
#
# `procedure` (ADR-0023 § 5.5): where to get the value, step by step,
# shown by the installation assistant and in Settings; `{host}` is the
# server's address on the local network.
# `prerequisite`: the software install.sh may have installed for it
# (pocket-id, gotify, syncthing, ollama); `suggested`: a value to start
# from, for a setting.
#
# The sign-in secrets (AISTACK_OIDC_CLIENT_SECRET, AISTACK_WEB_ADMIN_SCRYPT)
# are left out on purpose: changed from a page they guard, a mistake would
# lock the administrator out. They stay in `.env.web`, or in the
# installation assistant's own store (step 3).

keys:
  - name: AISTACK_GEMINI_API_KEY
    title: {fr: "Google Gemini — clé d'API", en: "Google Gemini — API key"}
    used_by: {fr: "Avis de l'IA de l'assistant de pannes", en: "The troubleshooting assistant's AI opinion"}
    applies: {fr: "immédiatement", en: "immediately"}
    test: gemini
    procedure:
      fr:
        - "Ouvre https://aistudio.google.com/apikey avec un compte Google."
        - "« Create API key » (Créer une clé API) ; choisis ou crée un projet Google Cloud."
        - "Copie la clé (elle commence par AIza) et colle-la ici. L'offre gratuite suffit."
        - "Sans elle, l'avis de l'IA vient d'Ollama seul, sur ce serveur."
      en:
        - "Open https://aistudio.google.com/apikey with a Google account."
        - "\"Create API key\"; choose or create a Google Cloud project."
        - "Copy the key (it starts with AIza) and paste it here. The free tier is enough."
        - "Without it, the AI's opinion comes from Ollama alone, on this server."
  - name: AISTACK_OPENAI_API_KEY
    title: {fr: "ChatGPT (OpenAI) — clé d'API", en: "ChatGPT (OpenAI) — API key"}
    used_by: {fr: "Avis de l'IA des appelants autorisés à sortir (ai_policy.yml), si le bloc openai est déclaré dans ai_runtime.yml", en: "The AI's opinion for callers allowed to go outside (ai_policy.yml), when the openai block is declared in ai_runtime.yml"}
    applies: {fr: "immédiatement", en: "immediately"}
    procedure:
      fr:
        - "Ouvre https://platform.openai.com/api-keys avec ton compte OpenAI."
        - "« Create new secret key » ; copie la clé (elle commence par sk-) et colle-la ici : elle n'est montrée qu'une fois."
        - "L'API est facturée à l'usage, séparément d'un abonnement ChatGPT : fixe un plafond de dépense dans ton compte OpenAI."
        - "Déclare aussi le bloc openai (model) dans ai_runtime.yml, et l'appelant external_allowed dans ai_policy.yml : sans cela, rien ne part."
      en:
        - "Open https://platform.openai.com/api-keys with your OpenAI account."
        - "\"Create new secret key\"; copy the key (it starts with sk-) and paste it here: it is shown only once."
        - "The API is billed by use, separately from a ChatGPT subscription: set a spending limit in your OpenAI account."
        - "Also declare the openai block (model) in ai_runtime.yml, and the caller external_allowed in ai_policy.yml: without both, nothing is sent."
  - name: AISTACK_ANTHROPIC_API_KEY
    title: {fr: "Claude (Anthropic) — clé d'API", en: "Claude (Anthropic) — API key"}
    used_by: {fr: "Avis de l'IA des appelants autorisés à sortir (ai_policy.yml), si le bloc anthropic est déclaré dans ai_runtime.yml", en: "The AI's opinion for callers allowed to go outside (ai_policy.yml), when the anthropic block is declared in ai_runtime.yml"}
    applies: {fr: "immédiatement", en: "immediately"}
    procedure:
      fr:
        - "Ouvre https://console.anthropic.com/settings/keys avec ton compte Anthropic Console."
        - "« Create Key » ; copie la clé (elle commence par sk-ant-) et colle-la ici : elle n'est montrée qu'une fois."
        - "L'API est facturée à l'usage, séparément d'un abonnement Claude : charge un crédit limité et surveille la consommation."
        - "Déclare aussi le bloc anthropic (model) dans ai_runtime.yml, et l'appelant external_allowed dans ai_policy.yml : sans cela, rien ne part."
      en:
        - "Open https://console.anthropic.com/settings/keys with your Anthropic Console account."
        - "\"Create Key\"; copy the key (it starts with sk-ant-) and paste it here: it is shown only once."
        - "The API is billed by use, separately from a Claude subscription: load a limited credit and watch the usage."
        - "Also declare the anthropic block (model) in ai_runtime.yml, and the caller external_allowed in ai_policy.yml: without both, nothing is sent."
  - name: AISTACK_GOTIFY_URL
    title: {fr: "Gotify — adresse", en: "Gotify — address"}
    used_by: {fr: "Notifications de la vigie", en: "The vigil's notifications"}
    applies: {fr: "au prochain passage de la vigie (15 min au plus)", en: "at the vigil's next pass (15 min at most)"}
    secret: false
    prerequisite: gotify
    suggested: "http://{host}:8070"
    procedure:
      fr:
        - "L'adresse de Gotify vue du serveur ; installé par install.sh, c'est celle proposée."
      en:
        - "Gotify's address as the server sees it; installed by install.sh, it is the one suggested."
  - name: AISTACK_GOTIFY_TOKEN
    title: {fr: "Gotify — jeton de l'application", en: "Gotify — application token"}
    used_by: {fr: "Notifications de la vigie", en: "The vigil's notifications"}
    applies: {fr: "au prochain passage de la vigie (15 min au plus)", en: "at the vigil's next pass (15 min at most)"}
    test: gotify
    prerequisite: gotify
    procedure:
      fr:
        - "Ouvre Gotify (http://{host}:8070) et connecte-toi en admin ; install.sh a mis son mot de passe dans /srv/gotify/.env."
        - "Change ce mot de passe : la roue dentée en haut à droite."
        - "Apps → Create Application, nom « AIStack » → copie son jeton (Token) et colle-le ici."
        - "Sur ton téléphone : l'application Gotify, connectée à la même adresse, reçoit les messages."
      en:
        - "Open Gotify (http://{host}:8070) and sign in as admin; install.sh put its password in /srv/gotify/.env."
        - "Change that password: the gear wheel at the top right."
        - "Apps → Create Application, named \"AIStack\" → copy its Token and paste it here."
        - "On your phone: the Gotify app, signed in to the same address, receives the messages."
  - name: SYNCTHING_API_KEY
    title: {fr: "Syncthing — clé d'API", en: "Syncthing — API key"}
    used_by: {fr: "Synchronisation vers les appareils (création et relance des partages)", en: "Sync to devices (creating and re-offering shares)"}
    applies: {fr: "immédiatement", en: "immediately"}
    test: syncthing
    prerequisite: syncthing
    procedure:
      fr:
        - "Ouvre Syncthing (http://{host}:8384) ; à la première ouverture, définis un utilisateur et un mot de passe pour son interface."
        - "Actions → Configuration (Settings) → onglet Général : copie la « Clé de l'API » (API Key) et colle-la ici."
      en:
        - "Open Syncthing (http://{host}:8384); the first time, set a user and a password for its interface."
        - "Actions → Settings → General tab: copy the API Key and paste it here."
  - name: JELLYFIN_API_KEY
    title: {fr: "Jellyfin — clé d'API", en: "Jellyfin — API key"}
    used_by: {fr: "Priorités CPU (lecture en cours)", en: "CPU priorities (playback in progress)"}
    applies: {fr: "au redémarrage du conteneur resource-priority", en: "when the resource-priority container restarts"}
    procedure:
      fr:
        - "Facultatif, si Jellyfin tourne sur ce serveur."
        - "Jellyfin → Tableau de bord → Clés API → « + », nom « AIStack » → copie la clé et colle-la ici."
      en:
        - "Optional, if Jellyfin runs on this server."
        - "Jellyfin → Dashboard → API Keys → \"+\", named \"AIStack\" → copy the key and paste it here."
  - name: BESZEL_EMAIL
    title: {fr: "Beszel — adresse e-mail", en: "Beszel — e-mail address"}
    used_by: {fr: "Architecture (relevés Beszel)", en: "Architecture (Beszel readings)"}
    applies: {fr: "au prochain rendu", en: "at the next rendering"}
    secret: false
    procedure:
      fr:
        - "Facultatif, si Beszel surveille tes machines : l'adresse e-mail d'un compte du hub Beszel (un compte en lecture suffit)."
      en:
        - "Optional, if Beszel watches your machines: the e-mail address of a Beszel hub account (a read-only one is enough)."
  - name: BESZEL_PASSWORD
    title: {fr: "Beszel — mot de passe", en: "Beszel — password"}
    used_by: {fr: "Architecture (relevés Beszel)", en: "Architecture (Beszel readings)"}
    applies: {fr: "au prochain rendu", en: "at the next rendering"}
    procedure:
      fr:
        - "Le mot de passe de ce compte Beszel."
      en:
        - "That Beszel account's password."
  - name: AISTACK_KUMA_URL
    title: {fr: "Uptime Kuma — adresse", en: "Uptime Kuma — address"}
    used_by: {fr: "Contrôles du démarrage (état des sondes d'Uptime Kuma)", en: "Start-up checks (the state of Uptime Kuma's monitors)"}
    applies: {fr: "au prochain passage de la vigie (15 min au plus)", en: "at the vigil's next pass (15 min at most)"}
    secret: false
    procedure:
      fr:
        - "Facultatif, si Uptime Kuma surveille tes machines : son adresse vue du serveur AIStack (par exemple http://adresse:3001), sans /metrics."
      en:
        - "Optional, if Uptime Kuma watches your machines: its address as the AIStack server sees it (for example http://address:3001), without /metrics."
  - name: AISTACK_KUMA_API_KEY
    title: {fr: "Uptime Kuma — clé d'API", en: "Uptime Kuma — API key"}
    used_by: {fr: "Contrôles du démarrage (état des sondes d'Uptime Kuma)", en: "Start-up checks (the state of Uptime Kuma's monitors)"}
    applies: {fr: "au prochain passage de la vigie (15 min au plus)", en: "at the vigil's next pass (15 min at most)"}
    procedure:
      fr:
        - "Uptime Kuma → Paramètres → Clés d'API → « Ajouter une clé d'API », nom « AIStack », sans date d'expiration → copie la clé (elle commence par uk) et colle-la ici : elle n'est montrée qu'une fois."
        - "Attention : dès la première clé d'API, Uptime Kuma n'accepte plus l'identifiant et le mot de passe sur /metrics ; un outil qui les y utilisait doit passer à une clé."
        - "AIStack ne fait que lire l'état des sondes (une requête sur /metrics). Une sonde en pause n'est pas publiée par Uptime Kuma : elle compte comme absente."
      en:
        - "Uptime Kuma → Settings → API Keys → \"Add API Key\", named \"AIStack\", with no expiry → copy the key (it starts with uk) and paste it here: it is shown only once."
        - "Note: once there is a first API key, Uptime Kuma no longer accepts the user name and password on /metrics; a tool that used them there must switch to a key."
        - "AIStack only reads the monitors' state (one request on /metrics). A paused monitor is not published by Uptime Kuma: it counts as missing."
  - name: AISTACK_SCRUTINY_URL
    title: {fr: "Scrutiny — adresse", en: "Scrutiny — address"}
    used_by: {fr: "Contrôles du démarrage (santé SMART des disques)", en: "Start-up checks (the disks' SMART health)"}
    applies: {fr: "au prochain passage de la vigie (15 min au plus)", en: "at the vigil's next pass (15 min at most)"}
    secret: false
    procedure:
      fr:
        - "Facultatif, si Scrutiny surveille tes disques : son adresse vue du serveur AIStack (par exemple http://127.0.0.1:8110), sans /api."
        - "AIStack ne fait que lire (quelques requêtes sur /api/summary et /api/device/…/details) et ne demande aucune clé. Un disque archivé dans Scrutiny n'est pas jugé."
      en:
        - "Optional, if Scrutiny watches your disks: its address as the AIStack server sees it (for example http://127.0.0.1:8110), without /api."
        - "AIStack only reads (a few requests on /api/summary and /api/device/…/details) and needs no key. A disk archived in Scrutiny is not judged."
