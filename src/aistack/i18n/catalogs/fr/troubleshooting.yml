guide:
  consumption: "Si {subject} n'a pas besoin du processeur en priorité, le bouton ci-dessous le classe en arrière-plan : il sera bridé dès qu'une application prioritaire (Jellyfin, Immich) travaille. S'il doit au contraire passer avant les autres, déclare-le dans priority de resource_priority.yml."
