# AIStack — this installation's address on the local network.
#
# `lan_hostname`: the name (or IP address) the local network's
# computers reach this server by; `service_ports`: the public listener
# (`console`, the one the reverse proxy forwards to) and the local
# network's (`web_lan`, never behind the reverse proxy).
#
# Filled by the installation assistant (/setup, step 1); edit it freely
# afterwards — AIStack reads it again when it restarts.
#
# `phase`: `development` while AIStack is being set up (an
# administrator's Explication is validated as written, an ADR may be
# accepted the day it is proposed); `production` once other people use
# it (a second person validates, nothing is ever deleted). Absent means
# `production`.

lan_hostname: localhost
service_ports:
  console: 8183
  web_lan: 8186
phase: development
