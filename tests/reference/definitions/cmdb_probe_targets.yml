# CMDB temps réel — cibles des sondes HTTP.
#
# Chargé par `load_cmdb_probe_targets_yaml`
# (`src/aistack/architecture/yaml/cmdb_targets_store.py`), rendu en
# section « CMDB temps réel » de `architecture.html`
# (`claude/PLAN-J11-CONSOLE-2026-09-11.md` §11.9.1 — premier des trois
# écarts nommés le 2026-09-13, cadré et livré le 2026-09-23).
#
# Écrit à la main, comme `infrastructure_topology.yml` et
# `service_categorization.yml` — aucun provider n'observe cette liste
# elle-même, seul `HttpProbeProvider` observe ce que chaque URL
# répond.
#
# **Source réelle, pas une supposition** (`GOV-P-001`) : la seule
# trace documentée de ce sujet était une ligne de l'ancienne page
# architecture.html — « CMDB temps réel (11 sondes HTTP, codes de
# statut) » — sans dire quelles cibles. Le owner a confirmé, le
# 2026-09-23, que la liste réelle vient de la configuration Homepage
# en service sur le Raspberry Pi
# (`/srv/homepage/config/services.yaml`, collée dans la conversation
# le jour même), filtrée par sa propre règle : « tout ce qui a une
# entrée href publique ». Ce fichier reflète cette liste telle que
# collée ce jour-là — pas `service_categorization.yml`, qui date d'une
# capture plus ancienne (2026-09-10, retouchée le 2026-09-12) et a
# depuis divergé (ex. ne porte pas l'entrée AIStack Console).
#
# Trois cas particuliers, chacun tranché explicitement avec le owner
# le 2026-09-23 :
#   - FreeboxOS (`persiaut-family.fr:15277`, port direct plutôt qu'un
#     sous-domaine proxifié NPM/Cloudflare Tunnel comme le reste) :
#     inclus.
#   - Indy (`app.indy.fr`, SaaS tiers de facturation, hors du homelab
#     lui-même) : inclus — un href public au sens de la règle du
#     owner, même s'il ne dit rien de la santé de l'infra locale.
#   - AIStack Console (`aistack.persiaut-family.fr/console.html`,
#     future page qui affichera cette même section) : EXCLU — éviter
#     qu'elle se sonde elle-même.
#
# `name` reprend le libellé exact de la configuration Homepage
# source, y compris son éventuelle coquille (« Boostack », pas
# « Bookstack ») — reproduit tel quel plutôt que corrigé, cette
# correction n'ayant pas été demandée.

