  clock: "Clock"
  containers: "Containers present"
  container_health: "Container health"
  docker_user: "DOCKER-USER chain"
  probes: "Probes"
  kvm_modules: "KVM modules"
  ups: "UPS"
  storage: "Disk space"
  backup: "Backups"
  previous_boot: "End of the previous run"
circumstance:
  unclean_previous_stop: "the previous stop was not clean"
  ups_event: "a UPS event"
  recent_restart: "recent restart"
  restart_in_backup_window: "restart inside the backup window"
  memory_pressure: "memory under pressure"
circumstances:
  heading: "Circumstances:"
  none: "none, the base controls are enough."
incidents:
