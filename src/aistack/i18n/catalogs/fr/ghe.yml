read_heading: Pour lire les textes
read_text: 'Les textes de référence sont dans le dépôt, en anglais : le manifeste (docs/00-foundation/The-Sustainable-Heritage-Manifesto.md), le registre des principes (docs/00-foundation/FDN-0012-AIStack-Principles-Registry.md), la constitution (FDN-0003), le patrimoine gouverné (FDN-0004) et le guide « Governed Heritage Engineering in AIStack » (docs/04-handbook/GHE-IN-AISTACK.md). Cette page les explique ; en cas d''écart, ce sont eux qui font foi. Les dépôts sont listés dans « Licence et sources ».'
translation_note: Le manifeste est écrit en français par son auteur ; le dépôt en garde la traduction anglaise, et les libellés de cette page sont des rendus en français des textes du dépôt.
