how_to:
  storage: "Libère de la place sur le point de montage indiqué, ou relève son seuil dans ./config/storage_thresholds.yml si la valeur est normale (OPS-0005)."
  services: "Regarde les journaux du conteneur (docker logs) pour comprendre pourquoi il redémarre ou n'est pas sain, puis corrige et redémarre-le ; l'assistant IA guide pas à pas."
  backup: "Vérifie que la tâche de sauvegarde tourne (systemctl list-timers, journalctl) et qu'elle écrit bien au chemin déclaré dans ./config/backup_thresholds.yml (OPS-0006)."
  gpu: "Vérifie la charge, la mémoire et la température du GPU (nvidia-smi) ; relève le seuil dans ./config/gpu_thresholds.yml si la valeur est normale (OPS-0007)."
  pra_tests: "Fais un vrai test de restauration du service, puis note-le dans ./config/pra_tests.yml (status, date, rto_minutes). Pour WordPress : python -m aistack.cli.sandbox restore wordpress, qui propose l'entrée (manuel, « Tester la restauration d'un service en bac à sable »). Pour AIStack lui-même : python -m aistack.cli.sandbox restore aistack, ou scripts/restore_aistack.sh (manuel, « Sauvegarder et restaurer AIStack »). Le test planifié du dimanche (aistack-pra.timer) le refait chaque semaine pour les services qui ont une recette."
  uncovered_state: "Déclare comment le service est sauvegardé dans ./config/backup_strategy.yml (OPS-0010), ou mets en place une sauvegarde s'il n'en a pas."
  inventory_gap: "Déclare le conteneur dans ./config/service_categorization.yml, marque-le on_demand: true s'il ne tourne qu'à la demande, ou arrête-le s'il ne doit pas tourner (OPS-0011)."
  hosts: "Sur l'hôte : systemctl status aistack-host-collector.timer, puis journalctl -u aistack-host-collector ; pour le Raspberry, vérifie aussi que /media/BACKUP est monté des deux côtés. python -m aistack.cli.hosts dit la dernière écriture de chaque hôte (ADR-0020)."
  data_budget: "python -m aistack.cli.data_budget montre ce qui prend la place ; --compress compresse tout de suite les observations plus anciennes que la fenêtre (rien n'est effacé). Sinon, raccourcis compress_after_days ou relève budget_mb dans ./config/data_budget.yml (ADR-0021)."
  quarantine: "Le code inutilisé est effacé à la revue ; un élément qui a servi sort de la quarantaine. Le détail : python -m aistack.cli.quarantine_report (OPS-0012)."
  other: "Lis la correction proposée pour chaque constat ; l'assistant IA guide pas à pas."
