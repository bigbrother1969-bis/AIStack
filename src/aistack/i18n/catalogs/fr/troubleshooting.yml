  domain: "Domaine : {domain}"
  start: "Commencer →"
  empty: "Aucune panne réelle qualifiée en ce moment, dans aucun domaine du Cockpit Santé ni côté consommation CPU — rien à guider. Cette page ne propose jamais de cas inventé ; les données sont recalculées à chaque visite, pas de vérification supplémentaire nécessaire."
