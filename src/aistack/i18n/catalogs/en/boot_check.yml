# "Start-up checks" screen and the cartouche indicator (ADR-0032).

title: "AIStack — Start-up checks"
heading: "Start-up checks"
meta: "The controls you used to run by hand after a reboot, run by AIStack and judged by code against what boot_checks.yml declares. Read-only: nothing here changes the host."
indicator:
  ok: "Start: all well for {elapsed}"
  pending: "Start: being checked ({elapsed})"
  warning: "Start: {count} to watch (since {elapsed})"
  critical: "Start: {count} to fix (since {elapsed})"
  unknown: "Start: not judged"
  title_ok: "Every control passes now. The host started {elapsed} ago."
  title_pending: "The host started {elapsed} ago and the checks wait for the containers to come up."
  title_anomaly: "The host started {elapsed} ago. Open the start-up checks for the controls that fail."
  title_unknown: "The checks could not judge the start: {note}"
elapsed:
  days: "{d} d {h} h"
  hours: "{h} h {m}"
  minutes: "{m} min"
summary:
  heading: "Now"
  overall: "Overall"
  started: "Started"
  since: "Time since the start"
  checked: "Last check"
  anomalies: "Anomalies"
  none: "No verdict yet: the checks have not run, or the host unit has not written its facts."
status:
  ok: "passes"
  pending: "waiting"
  warning: "to watch"
  critical: "to fix"
  skipped: "not checked"
  unknown: "not read"
  information: "information"
overall:
  ok: "all well"
  pending: "being checked"
  warning: "to watch"
  critical: "to fix"
  unknown: "not judged"
controls:
  heading: "Controls"
  control: "Control"
  status: "Result"
  detail: "Detail"
  technical: "The sentences are the program's own, in English; the names are those of your host."
  skipped_hint: "A control marked not checked has nothing declared to compare with: declare it in boot_checks.yml (python -m aistack.cli.boot_check --suggest prints what the facts say)."
control:
  failed_units: "Failed units"
  mounts: "Mounts"
  containers: "Containers present"
  container_health: "Container health"
  docker_user: "DOCKER-USER chain"
  probes: "Probes"
  kvm_modules: "KVM modules"
  ups: "UPS"
  storage: "Disk space"
  backup: "Backups"
  previous_boot: "End of the previous run"
incidents:
  heading: "Since the start"
  none: "No control has failed since the start."
  open: "still failing"
  resolved: "resolved"
  from: "from {first}"
  to: "to {last}"
