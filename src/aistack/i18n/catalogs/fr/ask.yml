your_question: "Ta question"
answer: "La réponse"
pending: "Le moteur réfléchit… la page se met à jour toute seule."
failed: "La question n'a pas pu être traitée. Réessaie dans un moment."
no_answer: "Aucun moteur autorisé n'a pu répondre pour l'instant. Réessaie dans un moment, ou demande à la personne qui s'occupe des machines."
detail: "Détail : {reason}"
not_kept: "Ta question et cette réponse ne sont écrites nulle part : elles disparaissent de la mémoire au bout d'une demi-heure, ou quand tu poses une autre question. Seul le journal garde que quelqu'un a posé une question, avec le moteur choisi, jamais son texte."
