<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('auth.title') }}</title>
  <style>{% include "auth/_style.html" %}</style>
</head>
<body>
  <h1>{{ t('auth.local.heading') }}</h1>
  <p class="note">{{ t('auth.local.intro') }}</p>
  {% if error %}<p class="message error">{{ error }}</p>{% endif %}
  <form method="post" action="/login/local">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="password">{{ t('auth.local.password') }}</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required autofocus title="{{ t('auth.tooltip.password') }}">
    <button type="submit" title="{{ t('auth.tooltip.local_submit') }}">{{ t('auth.local.submit') }}</button>
  </form>
  <a class="back" href="/console.html?lang={{ lang }}" title="{{ t('common.tooltip.back_to_console') }}">{{ t('common.console.back') }}</a>
</body>
</html>
