# The hosts AIStack traces (ADR-0020, decided by the owner 2026-10-08).
#
# Each host runs `aistack-host-collector` (src/aistack/host_collector.py,
# deploy/host-collector/), which writes its records to `directory`:
# relative to AIStack's data directory, or absolute. AIStack only reads
# them. `silent_after_minutes`: a host whose collector has not run for
# longer is said to be silent (the timer runs every 15 minutes).

silent_after_minutes: 60

hosts:
  gigabyte:
    directory: hosts/gigabyte
  # Written by the Raspberry on its own disk, which GIGABYTE mounts over
  # NFS at the same path.
  raspberry:
    directory: /media/BACKUP/AIStack/hosts/raspberry
