# AIStack — the host's exposure (ADR-0028)
#
# What the Cybersecurity Manager checks the listening sockets against.
# Read-only: it reports, it never closes anything.
#
# `declared_ports`: the ports you expect to find listening on every
# interface of the host, each with its purpose. A declared port is no
# longer reported. Ships empty: the first assessment lists what it finds,
# and you declare what is yours. Protect these ports by a firewall; the
# assessment does not read it yet and says so.
#
# `sensitive_ports`: a service behind one of these ports should not be
# reachable from every network. Listening on every interface without being
# declared is a finding to watch.
#
# `critical_ports`: whoever reaches one of these controls the host (the
# Docker API). The same, as a finding to fix.
#
# `accepted`: per kind of risk, the containers you accept carrying it by
# name (a monitor that holds the Docker socket, a VPN that adds a
# capability). The kinds are privileged, docker_socket, host_namespaces,
# capabilities, host_mounts and old_image. An accepted risk is counted, not reported.
# `python -m aistack.cli.security_assess --propose` prints both blocks.
#
# `max_image_age_days`: how old (days since the image was built) a running
# container's image may be. Older is a finding to watch; accept a container
# whose project is finished under `accepted: old_image`. The age is read
# locally: no registry is asked, so it says what is old, not what is newer.
#
# `max_reboot_pending_days`: how long a required reboot of the host may wait
# before it is a finding to watch. `max_apt_age_days`: how old the host's
# package lists may be. Both are read from the host snapshot
# `aistack-host-hygiene`, which also lists the upgrades that wait (the
# security ones are to watch) and the rights of the files that hold secrets:
# other access to one is a finding to fix, group access one to watch.
#
# `accepted_files`: sensitive files, by absolute path, whose wide rights you
# accept. They are counted, not reported.
#
# `max_listed`: how many names one finding carries before "and N more".
#
# Drift (T3a): the change records the host collectors of ADR-0020 write
# (files added, modified or removed, units enabled) are read over the last
# `drift_window_hours`. A change to a path of `drift_sensitive` (shell
# patterns, `*` crosses `/`) or a unit newly enabled is to watch, unless an
# apt run on that host explains it (`drift_apt_grace_minutes`: the collector
# notes a change when it next runs). `drift_noise` (a printer queue, the
# hardware clock, `*.dpkg-new`…) and `accepted_drift` (yours: a path you
# change on purpose) are counted, never reported. Each list, when you write
# it, replaces the built-in one; leave it out to keep the built-in list.

declared_ports: {}

sensitive_ports:
  22: SSH
  139: SMB
  445: SMB
  2049: NFS
  3306: MySQL / MariaDB
  3389: RDP
  3493: NUT (UPS)
  5432: PostgreSQL
  5900: VNC
  6379: Redis
  9200: Elasticsearch
  11211: Memcached
  27017: MongoDB

critical_ports:
  2375: Docker API (no TLS)
  2376: Docker API (TLS)

accepted: {}

max_image_age_days: 365

max_reboot_pending_days: 14

max_apt_age_days: 7

accepted_files: []

max_listed: 20

# Refusals (T3b): `aistack-firewall-snapshot` counts the packets the firewall
# drops (the counters hold no address, so the report says how many, never
# who). `refusal_window_hours` is the period counted. `refusal_watch_per_hour`
# is the sustained rate (over at least an hour of readings) from which the
# count is a finding to watch; 0 keeps it to information. Read the usual
# figure in the report first, then set a threshold above it.

# Logs (T3c): `aistack-host-logs` counts, over the last 24 hours and by kind
# of network (LAN, VPN, outside), the failed SSH logins, the packets
# DOCKER-USER refused and logged, and what Nginx Proxy Manager answered
# (status classes; probes such as /.env or /.git, which nobody but a scanner
# asks for; application paths such as wp-login.php or xmlrpc.php). It writes
# counts only: no address, path, user name or log line. These two make the
# figure from outside (or from an unknown origin) a finding to watch once it
# reaches the number you set; 0 keeps it to information. Set them above the
# usual figure of the report. A probe that a virtual host answers with a
# success (2xx) is a finding to watch whatever the threshold; a host that
# answers 200 to every path (a single-page application) and exposes nothing
# is accepted by name under `accepted_proxy_hosts`.

ssh_failed_outside_watch: 0

npm_scans_outside_watch: 0

accepted_proxy_hosts: []

refusal_window_hours: 24

refusal_watch_per_hour: 0

drift_window_hours: 24

drift_apt_grace_minutes: 60

accepted_drift: []
