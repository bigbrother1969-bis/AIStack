# AIStack — who publishes this installation's pages, and where the
# software comes from.
#
# The publisher is optional: without one, the legal notice says the
# installation is private. A person or a business that opens its
# console to the public declares itself here, for instance:
#
#   publisher: "Jane Doe"
#   legal_form: {fr: "Particulier", en: "Private person"}
#   siren: ""
#   city: "Lyon"
#   publication_director: "Jane Doe"
#   contact_url: "https://example.org"
#
# The rest names the software itself: its licence, its sources and its
# image — the same on every installation.

