# AIStack — the interface languages (ADR-0010).
#
# `reference`: the language every catalog is checked against; a key
# missing from another language is reported as a defect, not silently
# replaced. It is also served when a visitor has chosen nothing.
#
# `name`: each language's own name for itself ("English", not "Anglais"),
# so a visitor who cannot read the current language still finds theirs.
#
# `flag`: an SVG file under `flags/`, shown in the language switch in place
# of the name; the name stays as its alternative text and tooltip. A
# language without `flag` shows its name.
#
# Adding a language is one entry here, its flag under `flags/` and one
# directory under `catalogs/`.

reference: fr

languages:
  - code: fr
    name: Français
    flag: fr.svg
  - code: en
    name: English
    flag: gb.svg
