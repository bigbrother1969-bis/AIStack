# AIStack maintenance page — its own nginx, outside Docker.
#
# Answers every request on port 80 with 503 and the maintenance page, so
# a visitor (a site seen from the Cloudflare tunnel, a browser on the LAN)
# sees "maintenance in progress" while Docker is stopped, instead of an
# error. Started on demand by `scripts/maintenance_page.sh on`, never at
# boot, never next to the reverse proxy: both want port 80.
#
# `scripts/maintenance_page.sh install` copies this file to
# /etc/aistack-maintenance/nginx.conf; with --tls it also fills the
# `#TLS#` lines below, for a tunnel whose origin is https://…:443.

user www-data;
worker_processes 1;
pid /run/aistack-maintenance.pid;
error_log stderr warn;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    default_type text/html;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
#TLS#        listen 443 ssl default_server;
#TLS#        listen [::]:443 ssl default_server;
#TLS#        ssl_certificate     @TLS_CERT@;
#TLS#        ssl_certificate_key @TLS_KEY@;
        server_name _;

        root /usr/share/aistack-maintenance;

        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;

        error_page 503 /maintenance.html;
        location = /maintenance.html { internal; }
        location / { return 503; }
    }
}
