# AIStack — start-up checks (ADR-0032): what a healthy start looks like.
#
# After a reboot the owner runs the same controls by hand: failed units,
# mounts, the containers that should be there, the backups, the UPS, the
# monitor, the companion machine. AIStack runs them, judges them with code, and
# shows one indicator in the health strip: all is well since the last
# start, and for how long. An AI engine may add read-only controls from a
# closed catalogue and explain what failed; it never decides the verdict.
#
# `python -m aistack.cli.boot_check` reads the facts the host unit wrote
# (aistack-boot-facts) and judges them against this file. Run it with
# `--suggest` to print what the facts say as a declaration to copy here.
# Copy this file to your own configuration directory to change it.

# Minutes after a start before the checks judge: containers need time to
# come up, and the restart watch (ADR-0025) works in its own window.
settle_minutes: 10

# The containers that must exist after a start. Empty = not declared: the
# control is skipped, AIStack never guesses a list for you.
expected_containers: []

# The ones you keep stopped on purpose; a stopped container not listed here
# is a finding.
expected_stopped: []

# Paths that must be mounted after a start (absolute).
mounts: []

# The Uptime Kuma monitors that must be running after a start, by name. Needs
# the address and an API key of Uptime Kuma in Settings; without them the
# control is skipped. A paused monitor is not published by Uptime Kuma, so it
# counts as missing. Empty = no reference list: a monitor that is down is still
# a finding.
expected_monitors: []

# Scrutiny (the disks' SMART readings; its address is set in Settings, without it the
# control is skipped). A disk whose last report is older than this many hours is not
# read; a disk with at least `disk_old_hours` of use is said to be old (leave it out
# to say nothing of age). A SMART failure is to fix; a critical attribute above zero
# (reallocated, pending or uncorrectable sectors, spin retries) is to watch.
disk_report_hours: 36
# disk_old_hours: 50000

# Beszel (the machines it watches; its account is the one of the architecture page, set
# in Settings; without it the control is skipped). A machine Beszel calls down is to
# watch, and so is one whose disk or memory use (percent) or temperature (degrees) is at
# one of these limits. The CPU is not judged: one instant of it says nothing of a start.
system_disk_percent: 90
system_memory_percent: 90
system_temperature_celsius: 80

# How fast the system disks fill. A straight line is fitted through the last
# `disk_trend_days` of what Beszel measured (every 8 hours, about 27 days kept); with
# fewer than `disk_trend_min_days` of history it says "not measured", never "fine".
# A disk that would be full within `disk_full_days` is to watch. Only the system disk
# of a machine Beszel watches is seen; a data disk it does not follow is not.
disk_full_days: 30
disk_trend_days: 14
disk_trend_min_days: 7

# The data disks, those the host mounts under /media or /mnt (the system disk is
# Beszel's, above). One sample of each is kept about every 7 hours for `usage_days`
# days; a disk at or above `data_disk_percent` percent is to watch, and so is one
# whose trend (the same as above) fills it within `disk_full_days`. To name the disks
# yourself, list their mount points; the thresholds you declared for the storage
# domain (OPS-0005) keep working next to this, and `data_disk_full: ignore` in
# `severity` leaves the percent to them.
data_disk_percent: 90
usage_days: 60
# usage_points:
#   - /media/Data

# How many rules the DOCKER-USER chain holds after a start. Leave it out to
# skip the control.
# docker_user_rules: 7

# The probes the host unit asks (a label and the URL it answers, set on the
# host) and the HTTP status each must answer after a start. None = skipped.
#
#   probes:
#     proxy: 200
probes: {}

# What the first word of the UPS status may be after a start (OL = on line).
ups_expected: [OL]

# How much each finding weighs: ignore, warning or critical. Only the keys
# you change need to be here; these are the shipped values.
severity:
  failed_unit: critical
  container_missing: critical
  container_stopped: warning
  container_unhealthy: warning
  mount_missing: critical
  docker_user_changed: warning
  kvm_modules: ignore
  backup_failed: critical
  backup_late: warning
  storage_low: warning
  probe_failed: critical
  ups_on_battery: warning
  monitor_down: warning
  disk_failing: critical
  disk_attribute: warning
  system_down: warning
  system_pressure: warning
  disk_full_soon: warning
  data_disk_full: warning
  data_disk_soon: warning
  companion_unreachable: critical
  companion_throttled: warning

# Also check the companion machines the instance declares in hosts.yml (each
# has its own indicator, same rules). A companion is judged from the facts its
# own copy of the host unit writes in its `boot` folder (ADR-0020 brings it
# here); a host with no `boot` folder is not judged.
companions: true

# A companion whose last facts are older than this many minutes is
# unreachable: its facts are written every five minutes and pushed every
# fifteen.
companion_silent_minutes: 45

# The history of the verdicts: the journal of what changed (a control that starts to
# fail, changes its status or comes back), kept per machine so the page can say since
# when. A pass that changes nothing writes nothing. The oldest lines go first, past
# this many days or this many lines.
history_days: 180
history_events: 2000

# The paths that must be mounted on a companion after a start, by the host's
# name in hosts.yml. Empty = not declared: the control is skipped.
#
#   companion_mounts:
#     backup-host: [/media/BACKUP]
companion_mounts: {}

# The extra controls (ADR-0032 § 3): they run only when the circumstances call for
# them, the circumstances being computed from the facts. The containers of the
# databases whose log is read for a recovery after the start (the host unit reads
# the same names: AISTACK_BOOT_DATABASES in its host.conf); empty skips that control.
database_containers: []
timezone: Europe/Paris
backup_window:
  from: "02:00"
  until: "05:00"
# A start under this many hours old is "recent".
recent_restart_hours: 12
# Memory under pressure: the 5-minute pressure and the swap in use, in percent.
memory_pressure_percent: 10
swap_used_percent: 50
# Which circumstances justify which extra control. The circumstances are
# unclean_previous_stop, ups_event, recent_restart, restart_in_backup_window and
# memory_pressure; the extra controls are database_recovery, kernel_disk_errors,
# restart_cause, backup_after_restart and memory. Both lists are closed.
catalogue:
  database_recovery: [unclean_previous_stop]
  kernel_disk_errors: [unclean_previous_stop]
  restart_cause: [recent_restart, ups_event]
  backup_after_restart: [restart_in_backup_window]
  memory: [memory_pressure]

# The indicator stays beside the weighted health score, not inside it. Set
# true to let its findings weigh in the score as well.
indicator_weighted: false

# The AI engine may add read-only controls from the closed catalogue and
# explain the findings, never more than this many extra controls a start.
ai:
  enabled: true
  max_extra_controls: 3

# One Gotify message in the morning, only a summary: no message for each
# finding.
summary:
  enabled: true
  at: "08:00"
