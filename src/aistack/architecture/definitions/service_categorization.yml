# AIStack — how the Architecture page groups the services: categories,
# each with its services (`name`, the `container` that runs it when
# there is one, an `icon`, the address it answers on — `href` —, a
# `description`). A container AIStack discovers and no category names
# is drawn on its own. Nothing is declared on a new installation; for
# instance:
#
#   categories:
#     - name: Media
#       services:
#         - name: Jellyfin
#           container: jellyfin
#           icon: jellyfin
#           href: https://jellyfin.example.org
#           description: Films and series

categories: []
