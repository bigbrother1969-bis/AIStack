# AIStack — the disk budget of AIStack's data directory (ADR-0021).
#
# - budget_mb: what AIStack's data may take on its disk. Past
#   warn_percent of it, the health cockpit's "Données d'AIStack" domain
#   has a finding; past the budget, an urgent one.
# - compress_after_days: an observation older than this is
#   gzip-compressed in place — still read by AIStack, never deleted.
# - compress: the directories of the data directory whose history is
#   compressed that way.

budget_mb: 2048
warn_percent: 80
compress_after_days: 90
compress:
  - history
  - docker-diff
  - docker-events
