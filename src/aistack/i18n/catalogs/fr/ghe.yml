  ARC-P-007: Monolithe modulaire d'abord
  ARC-P-008: L'architecture évolue par étapes validées, une à une
  ARC-P-009: Les frontières de déploiement ne définissent pas celles de l'architecture
  ARC-P-010: Le noyau et son Runtime restent séparés
  ARC-P-011: Les capacités disent ce qu'AIStack sait faire ; les services les fournissent
