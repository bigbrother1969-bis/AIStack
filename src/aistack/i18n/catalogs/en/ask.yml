# "Ask a question" page (portal.chat, ADR-0029 § 12).

screen_intro: "Before anything is sent, AIStack looks for personal data in your question (e-mail address, telephone, postal address, bank details, password, health, family…). If it finds any, the question stays on the machines of the house. It cannot recognise a plain first name: write nothing confidential."
