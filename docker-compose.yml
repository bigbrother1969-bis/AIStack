  #
  # **0.4.0 — published 2026-09-03.**
  #
  #   bigbrother1969/aistack-core:0.4.0
  #   @sha256:daf46c76b309e047c8801a25857b1328c01fc69c84c25d1ac333e05c8bb2f9fb
  #
  # Built from 8757605 on the reference host, behind the four terms
