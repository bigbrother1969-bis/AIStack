# PLAN-J11 — Console AIStack: v1 scope, declared by the owner
# 2026-09-11 (`claude/PLAN-J11-CONSOLE-2026-09-11.md` § 2).
#
# Written by hand, read-only — same discipline
# `service_categorization.yml` and `health_score_weights.yml` already
# hold. Nothing in this codebase writes this file back.
#
# `url` is exactly how the owner reaches each service today
# (`PLAN-J11` § 4/§ 8/§ 9), never invented (GOV-P-001):
#   - Selection UI and Priorité CPU are separate processes on
#     GIGABYTE (Docker Compose on :8181, systemd/uvicorn on :8182 —
#     "next free port after Selection UI's 8181"). The console itself
#     went live behind Nginx Proxy Manager (Raspberry) on
#     aistack.persiaut-family.fr the same day (`PLAN-J11` § 7) —
#     the owner first named two more subdomains for these two apps
#     under it (selection.aistack.persiaut-family.fr,
#     priority.aistack.persiaut-family.fr, `PLAN-J11` § 8), then
#     found those unreachable: Cloudflare's free Universal SSL covers
#     only a domain and its direct wildcard (persiaut-family.fr,
#     *.persiaut-family.fr), never a second-level subdomain — the TLS
#     handshake failed before any certificate was even offered
#     (`PLAN-J11` § 9). Renamed to first-level subdomains instead,
#     covered by the same wildcard that already makes
#     aistack.persiaut-family.fr work: selection.persiaut-family.fr,
#     priority.persiaut-family.fr. Declared here as the owner's own
#     chosen naming, the same way aistack.persiaut-family.fr was
#     declared before its own Proxy Host existed — reachable once the
#     owner has added the matching Proxy Host in NPM (and the DNS
#     record in Cloudflare), a manual step this codebase cannot do.
#     The direct LAN address each still answers on
#     (GIGABYTE:8181/:8182) travels in the description, not the url,
#     so there is exactly one link to follow, not two competing ones.
#
#     **Reversed 2026-09-18.** The owner asked to close every page
#     reachable from this console down to LAN-only, "y compris pour
#     selection et priority" — these two were the only remaining
#     public exceptions (Découverte réseau and Assistant de pannes
#     were already LAN-only from their own first day). `url` now
#     points at the direct LAN address for both
#     (`http://GIGABYTE:8181`, `http://GIGABYTE:8182`), the same
#     shape Découverte réseau and Assistant de pannes already use.
#     The console itself, Architecture and Cockpit Santé stay public
#     — the owner's explicit choice, not touched here. Closing the
#     public route for real is a manual step outside this repository
#     (removing the `selection.persiaut-family.fr` and
#     `priority.persiaut-family.fr` Proxy Host entries in Nginx
#     Proxy Manager on the Raspberry) — this file only decides what
#     the console *links to*, kept, not erased, as the record of what
#     was reversed and why (the paragraph above).
#   - Page Architecture and Cockpit Santé are static files this
#     console is served alongside (`reports/generated/public/`,
#     `aistack.cli.console_render`), so their own URLs are relative —
#     they were already reachable through
#     aistack.persiaut-family.fr/architecture.html and /health.html
#     the moment NPM pointed at the console (same origin, same
#     process, `PLAN-J11` § 7) — no separate Proxy Host needed for
#     either.
#   - Découverte réseau (utilisateurs SSH) — added 2026-09-12
#     (`PLAN-J11` § 11), a separate systemd/uvicorn process on
#     GIGABYTE:8184 ("next free port after the console's 8183"),
#     `network_discovery_ui`. Deliberately LAN-only, `http://`, never
#     a `https://...persiaut-family.fr` subdomain and never a Proxy
#     Host in NPM: this screen writes which SSH usernames get tried,
#     unattended, against every host a network scan finds on the
#     owner's own LAN — decided with the owner 2026-09-12 that this
#     stays unreachable from the public internet, unlike every other
#     card on this page.
#   - Assistant de pannes — added 2026-09-18
#     (`claude/PLAN-TROUBLESHOOTING-ASSISTANT-UI-2026-09-18.md`), a
#     separate systemd/uvicorn process on GIGABYTE:8185 ("next free
#     port after network_discovery_ui's 8184"),
#     `troubleshooting_assistant_ui`. LAN-only for the same reason as
#     Découverte réseau: not a security concern here (this screen
#     only reads real findings and calls Ollama, never SSH), but a
#     deliberate v1 choice confirmed with the owner — reduce the
#     exposed surface while real usage is still being discovered,
#     widen later only if asked.

#   - **Localized 2026-09-27** (ADR-0010, the owner's own decision to
#     let each user choose the interface language, French the
#     reference, English the second). `name` and `description` are
#     each either one string, the same in every language (a product
#     name such as "Selection UI" is not translated), or a mapping
#     from language code to text; `url` never is — where a service
#     lives does not depend on who reads the card. The French text is
#     exactly what each card said before; the console adds `?lang=` to
#     each absolute `url` itself, so none is written here.

