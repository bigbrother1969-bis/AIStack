# AIStack — run AIStack from its published image (ADR-0017, 1.8).
#
#   cp .env.example .env              # version, user and group ids — edit it
#   mkdir -p config data              # owned by that user, before Docker creates them as root
#   touch .env.web && chmod 600 .env.web   # secrets (README, How to install)
#   docker compose up -d
#
# One image, one service per process: the web application and the
# five collectors, restarted and logged by Docker as systemd does on a
# git installation. Every service:
#
#   - runs on the host's network (`network_mode: host`): the public
#     listener (8183) and the local-network listener (8186) answer on
#     the host's own ports, and the network scan sees the LAN;
#   - talks to the host's Docker through its socket — the account it
#     runs as must be in the socket's group (`DOCKER_GID`);
#   - reads its declarations from `./config` (filled with the shipped
#     ones at first start, never overwritten) and keeps everything it
#     records in `./data`;
#   - sees each host directory a declaration names AT THE SAME PATH,
#     read-only: backup disks, media libraries, the folders holding the
#     Compose projects AIStack reads. Add yours at the end of the
#     `volumes:` list of `x-aistack` below.
#
# One-off commands run in the same image:
#
#   docker compose exec web python -m aistack.cli.health_render
#   docker compose exec web python -m aistack.cli.timemachine_rebuild
#   docker compose run --rm validate
#
# The six services replace the six systemd units of a git
# installation; never run both on one host (the ports and the
# collectors would collide).

x-aistack: &aistack
  image: bigbrother1969/aistack-core:${AISTACK_VERSION:?set AISTACK_VERSION in .env}
  build:
    context: .
    dockerfile: Dockerfile
  network_mode: host
  restart: unless-stopped
  user: "${AISTACK_UID:-1000}:${AISTACK_GID:-1000}"
  group_add:
    - "${DOCKER_GID:-999}"
  env_file:
    - path: .env.web
      required: false
    - path: .env.resource-priority
      required: false
  volumes:
    - ./config:/config
    - ./data:/app/reports/generated
    - /var/run/docker.sock:/var/run/docker.sock
    # The host directories your declarations name, at the same path,
    # read-only. The reference host keeps its disks under /media and
    # its Compose projects under /srv and /opt.
    - /media:/media:ro
    - /srv:/srv:ro
    - /opt:/opt:ro

services:

  web:
    <<: *aistack
    container_name: aistack-web
    command: ["web"]

  events:
    <<: *aistack
    container_name: aistack-docker-events
    command: ["events"]

  diff:
    <<: *aistack
    container_name: aistack-docker-diff
    command: ["diff"]

  digest:
    <<: *aistack
    container_name: aistack-docker-digest
    command: ["digest"]

  packages:
    <<: *aistack
    container_name: aistack-docker-packages
    command: ["packages"]

  priority:
    <<: *aistack
    container_name: aistack-resource-priority
    command: ["priority"]

  # The knowledge-integrity validator, a one-shot tool (exits 0 when
  # the bundle is sound, 1 on a blocking finding, 2 without a bundle):
  # never started by `up`, run with `docker compose run --rm validate`.
  validate:
    image: bigbrother1969/aistack-core:${AISTACK_VERSION:?set AISTACK_VERSION in .env}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    command: ["validate"]
    volumes:
      - ./context/bundles:/app/context/bundles:ro
    restart: "no"

