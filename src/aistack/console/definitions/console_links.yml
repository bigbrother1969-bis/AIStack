# AIStack — the console's cards: AIStack's own screens.
#
# Each card names its page — `url` (a page of the public address) or
# `service` + `path` (a screen of the local network, `web_lan` in
# instance_config.yml) —, a `description`, an optional `ai` line, and
# its `scope`: `public` (both addresses) or `lan` (the local network
# only), and `ai_callers`: the uses of a model of ai_policy.yml its
# screen reaches (`[]` when it asks no engine). The console writes from
# them, and from the policy, whether the card uses AI engines and
# whether one may be outside. Add your own cards the same way, for
# instance a link to a service of yours (without `ai_callers`, the card
# says nothing of AI):
#
#   - name: Nextcloud
#     description: {fr: "Les fichiers de la maison", en: "The household's files"}
#     url: https://cloud.example.org
#     scope: public

links:
  - name: Selection UI
    description:
      fr: >-
        Choisir, contenu par contenu (musique, livres, BD, photos,
        vidéos, documents…), ce qui part vers le téléphone ou un
        ordinateur, et vérifier la place disponible.
      en: >-
        Choose, content by content (music, books, comics, photos,
        videos, documents…), what goes to the phone or a computer, and
        check the space available.
    service: web_lan
    path: /selection/
    scope: lan
    ai_callers: []
  - name:
      fr: Priorité CPU
      en: CPU priority
    description:
      fr: >-
        Régler quels programmes ont la priorité sur le processeur
        quand plusieurs tournent en même temps (par exemple,
        privilégier la lecture vidéo sur les tâches de fond).
      en: >-
        Set which programs get the processor first when several run at
        once (for example, video playback before background tasks).
    service: web_lan
    path: /priority/
    scope: lan
    ai_callers: []
  - name:
      fr: Nouveautés
      en: New arrivals
    description:
      fr: >-
        Les conteneurs et les machines apparus que rien ne déclare : les
        voir, déclarer un conteneur d'un clic, ou l'écarter.
      en: >-
        The containers and machines that appeared and that nothing
        declares: see them, declare a container with a click, or set it
        aside.
    service: web_lan
    path: /arrivals/
    scope: lan
    ai_callers: []
  - name:
      fr: Relance au démarrage
      en: Restart after boot
    description:
      fr: >-
        Après un démarrage de la machine, voir quels conteneurs sont
        restés bloqués (en marche mais inutilisables), lesquels ont été
        relancés, dans quel ordre, et pourquoi certains ne l'ont pas été.
      en: >-
        After the machine starts, see which containers stayed stuck
        (running but unusable), which were restarted, in what order,
        and why some were not.
    service: web_lan
    path: /restart-watch/
    scope: lan
    ai_callers: []
  - name:
      fr: Moteurs IA
      en: AI engines
    description:
      fr: >-
        Voir quels moteurs d'IA AIStack interroge (chez toi ou chez un
        fournisseur), la politique qui choisit entre eux selon le type de
        requête, ce que chaque appel a décidé et pourquoi. Lecture seule ;
        aucun texte de question ni de réponse n'est conservé.
      en: >-
        See which AI engines AIStack asks (on your machines or at a
        provider), the policy that chooses among them by kind of request,
        and what each call decided and why. Read-only; no text of any
        question or answer is kept.
    service: web_lan
    path: /ai-engines/
    scope: lan
    ai_callers: []
  - name:
      fr: Poser une question
      en: Ask a question
    description:
      fr: >-
        Poser une question avec tes mots, sans rien connaître aux
        machines : AIStack cherche d'abord des données personnelles
        dans ta question (si oui, elle reste chez toi), choisit le
        moteur d'IA, te dit lequel a répondu et pourquoi. Rien n'est
        conservé.
      en: >-
        Ask a question in your own words, without knowing anything
        about the machines: AIStack first looks for personal data in
        your question (if any, it stays at home), chooses the AI engine
        and tells you which one answered and why. Nothing is kept.
    service: web_lan
    path: /ask/
    ai:
      fr: >-
        AIStack examine ta question avant l'envoi : s'il y trouve des données personnelles, elle reste sur tes machines (modèle local) ; sinon, un fournisseur externe peut répondre si la politique l'autorise. La page te dit qui a répondu et pourquoi.
      en: >-
        AIStack examines your question before sending it: if it finds personal data, it stays on your machines (local model); otherwise an outside provider may answer if the policy allows it. The page tells you who answered and why.
    scope: lan
    ai_callers: [portal.chat]
  - name: Architecture
    description:
      fr: >-
        Consulter le schéma de l'infrastructure personnelle : les
        machines, les services, et la façon dont ils sont reliés
        entre eux.
      en: >-
        See the diagram of the personal infrastructure: the machines,
        the services, and how they are connected to each other.
    url: /architecture.html
    scope: public
    ai_callers: []
  - name:
      fr: Cockpit Santé
      en: Health cockpit
    description:
      fr: >-
        Suivre la note de santé globale de l'infrastructure, et le
        détail des anomalies détectées domaine par domaine (stockage,
        sauvegardes, processeur graphique, tests de reprise après
        incident...).
      en: >-
        Follow the overall health score of the infrastructure, and the
        detail of the faults found domain by domain (storage, backups,
        graphics processor, disaster recovery tests...).
    url: /health.html
    ai:
      fr: >-
        Chaque anomalie mène à l'assistant de pannes, où l'IA (Google Gemini, Ollama en secours) donne son avis.
      en: >-
        Each finding leads to the troubleshooting assistant, where the AI (Google Gemini, Ollama as the fallback) gives its opinion.
    scope: public
    ai_callers: [troubleshooting]
  - name:
      fr: Découverte réseau
      en: Network discovery
    description:
      fr: >-
        Gérer la liste des noms d'utilisateur SSH essayés
        automatiquement lors de la recherche des appareils présents
        sur le réseau local.
      en: >-
        Manage the SSH user names tried automatically when looking for
        the devices present on the local network.
    service: web_lan
    path: /network-discovery/
    scope: lan
    ai_callers: []
  - name:
      fr: Assistant de pannes
      en: Troubleshooting assistant
    description:
      fr: >-
        Traiter une panne réelle, pas à pas : ce qu'AIStack en sait,
        ce que tu fais (avec la correction en un clic quand elle
        existe), puis l'avis de l'IA si tu le demandes.
      en: >-
        Handle a real fault, step by step: what AIStack knows of it,
        what you do (with the one-click fix when there is one), then
        the AI's opinion if you ask for it.
    service: web_lan
    path: /troubleshooting/
    ai:
      fr: >-
        AIStack établit les faits et la marche à suivre ; sur ton clic, Google Gemini donne son avis à partir de ces faits (ils sortent alors de ton réseau), avec un modèle local (Ollama) en secours ; rien ne s'applique sans ton clic.
      en: >-
        AIStack states the facts and what to do; on your click, Google Gemini gives its opinion from those facts (they then leave your network), with a local model (Ollama) as the fallback; nothing is applied without your click.
    scope: lan
    ai_callers: [troubleshooting]
  - name:
      fr: Sécurité
      en: Security
    description:
      fr: >-
        Voir ce qui est ouvert, ce qui essaie d'entrer et ce qui a
        changé sur tes machines, avec des graphes dans le temps ;
        déclarer une fenêtre de maintenance quand tu travailles
        dessus.
      en: >-
        See what is open, what tries to get in and what has changed
        on your machines, with graphs over time; declare a
        maintenance window when you work on them.
    service: web_lan
    path: /security/
    ai:
      fr: >-
        Sur ton clic, le moteur local (Ollama) explique un constat et suggère quoi faire ; rien ne sort de ta machine et rien n'est exécuté.
      en: >-
        On your click, the local engine (Ollama) explains a finding and suggests what to do; nothing leaves your machine and nothing is run.
    scope: lan
    ai_callers: [security.page]
  - name: Time Machine
    description:
      fr: >-
        Parcourir l'historique complet de l'infrastructure — commandes
        exécutées, mises à jour de paquets, versions des images,
        raisonnements de l'assistant IA — sous forme de graphe
        consultable.
      en: >-
        Browse the whole history of the infrastructure — commands run,
        package updates, image versions, the AI assistant's reasoning —
        as a graph you can explore.
    service: web_lan
    path: /timemachine/
    ai:
      fr: >-
        Garde chaque raisonnement de l'IA, daté et relié à ce qu'il explique, pour que tu puisses le relire, le corriger ou le valider.
      en: >-
        Keeps every reasoning of the AI, dated and tied to what it explains, so you can read it again, correct it or validate it.
    scope: lan
    ai_callers: []
  - name:
      fr: Dock
      en: Dock
    description:
      fr: >-
        Mettre à jour un service de façon gouvernée : la nouvelle image
        est proposée avec son pourquoi, validée, testée en bac à sable
        avec la dernière sauvegarde, puis appliquée avec retour arrière
        prêt.
      en: >-
        Update a service the governed way: the new image is proposed
        with its why, validated, tested in a sandbox with the latest
        backup, then applied with the way back ready.
    service: web_lan
    path: /dock/
    scope: lan
    ai_callers: []
