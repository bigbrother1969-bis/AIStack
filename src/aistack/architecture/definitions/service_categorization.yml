# Service categorization — which category each service belongs to,
# the container it maps to when it runs as one, and how the owner
# wants it presented (icon, link, description).
#
# Loaded by `load_service_categorization_yaml`
# (`src/aistack/architecture/yaml/store.py`), and read by the J2
# architecture-diagram build (`claude/PLAN-TRAJECTOIRE-2026-09-04.md`).
#
# Ported 2026-09-10 from the pre-AIStack architecture.html generator's
# own `homepage/services.yaml`
# (`/mnt/backup/homelab_documentation/homepage/services.yaml`,
# `claude/PLAN-J2-ARCHITECTURE-HTML-2026-09-10.md`) — GOV-P-001: which
# category a service belongs to is the owner's own decision, not
# something Docker or Compose can say.
#
# **`icon`/`href`/`description` joined `name`/`container` here
# 2026-09-12** (`claude/PLAN-J11-CONSOLE-2026-09-11.md` §10) — the
# owner confirmed, service field by field, that reopening the
# 2026-09-10 decision to drop them was wanted. `icon` is not the
# source file's own value (`nginx-proxy-manager.png`,
# `mdi-router-wireless`, `fa-user-tie`, and one dead reference —
# `books`, replaced with the owner's own choice,
# `book-open-page-variant`) — it is a bare key into
# `renderers/architecture/vendor/icons/`
# (`vendor/icons/PROVENANCE.md` names exactly which source each
# vendored file came from). `href`/`description` travel unchanged
# from the source.
#
# `server` still does not travel, and still does not on purpose: the
# source distinguishes Raspberry Pi from Gigabyte by which
# `docker-compose.yml`, on which host, declares a service — an
# observation AIStack has no provider for. The reconstructed diagram
# instead marks a service "observed" when its container is live in
# GIGABYTE's own Docker Catalog, "declared" otherwise (same plan, "Une
# réduction de périmètre assumée"). A service with no `container:` at
# all here is one the source itself named with no container —
# hardware AIStack has no provider for (the Freebox itself, Pi-hole,
# LibreSpeed), or something reached through Docker without being a
# container of its own (Architecture Homelab, Indy, Music Sync).
#
# This file is edited by hand — no UI writes it back the way
# `priority_ui` writes `resource_priority.yml`.

