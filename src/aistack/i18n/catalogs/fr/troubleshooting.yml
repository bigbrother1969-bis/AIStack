# Mini-app Assistant de pannes (troubleshooting_assistant_ui) — ADR-0010.
# Les segments *_before / *_after entourent un fragment de code ou un
# nom (<code>, <strong>) que le gabarit insère lui-même : un message ne
# porte jamais de balisage (ADR-0010 § 1).

title: "AIStack — Assistant de pannes"
