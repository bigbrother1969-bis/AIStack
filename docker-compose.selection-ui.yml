# An explicit project name.
#
# Compose derives the project from the directory when none is given.
# This file lives in `AISTack/`, the backend's compose lives in the
# parent directory `/srv/aistack/`, and both normalise to `aistack` —
# one project, two files, each seeing the other's containers as
# orphans. Compose says so on every run:
#
#   Found orphan containers ([aistack-selection-ui]) for this project.
#   … you can run this command with the --remove-orphans flag.
#
# Following that advice from the parent directory would have deleted
# this service. Naming the project removes the ambiguity rather than
# relying on nobody typing the suggested flag.
name: aistack-selection-ui

services:
  aistack-selection-ui:
    # Pinned by digest, not by tag: a tag is mutable, a digest is not.
    # Same discipline as the Context Bundle manifest — an artifact in use
    # must be identifiable by its content, not by a label someone can move.
    image: bigbrother1969/selection-ui:0.3@sha256:bb04bd50b24c71995e81683d53c056c1dfb3028f0e1465103c987df18445dff3
    container_name: aistack-selection-ui
    #
    # ⚠ 0.3 cannot be rebuilt.
    #
    # The image declares
    # `org.opencontainers.image.revision=a13e4b3d22f8272349b5eafae77a188502206f3e`.
    # That commit was looked for on 2026-08-21 in every repository
    # that could hold it — the laptop clone, the SPOT host clone, and
    # `/srv/aistack`, the ancestor repository this one lives inside —
    # and `git cat-file` reports the object as absent from all three.
    # It was not pruned from a branch: the object itself is gone.
    #
    # So the digest above identifies the image, and nothing identifies
    # its source. What this container has been serving since it was
    # started cannot be read, audited or reproduced. A pinned digest
    # guarantees that the bytes do not change; it does not tell anyone
    # what those bytes are.
    #
    # This is the reason for 0.4 rather than a version bump: the point
    # is not that 0.3 is old, it is that it is unaccountable.
    #
    # Built and published manually — buildx is not used here.
    # The command below is the one that produced the image above:
    #
    #   docker build -f Dockerfile.selection-ui \
    #     --label org.opencontainers.image.source="https://gitea.persiaut-family.fr/fabrice.persiaut/AIStack" \
    #     --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
    #     --label org.opencontainers.image.version="0.3" \
    #     --label org.opencontainers.image.licenses="AGPL-3.0-or-later" \
    #     -t bigbrother1969/selection-ui:0.3 .
    #   docker push bigbrother1969/selection-ui:0.3
    #
    # `$(git rev-parse HEAD)` records whichever repository the shell
    # happened to be standing in. Run one directory higher, it stamps
    # the ancestor's history onto an image built from this one. A
    # revision label is only evidence if the build states which
    # repository it means.
    #
    ports:
      - "8181:8181"
    volumes:
      - /media/TechData:/media/TechData
    env_file:
      - .env.selection-ui
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
