# AIStack — CPU priorities between containers (the CPU priority
# screen): `priority` lists the containers given more CPU while they
# work (a `detector` says when: CPU above a threshold, or Jellyfin
# playing), `background` the containers held back meanwhile. Written
# by the screen; nothing is declared on a new installation.

priority: []
unlimited_cpus: 4.0
grace_seconds: 60.0
background:
  default_throttled_cpus: 0.1
  containers: []
