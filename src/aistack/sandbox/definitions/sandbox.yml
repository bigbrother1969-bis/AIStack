# AIStack — restore tests in a sandbox: per service, a `recipe` that
# restores its latest backup into throwaway containers under
# `run_root`, checks it answers, and removes everything. `margin_gib`:
# free space kept on top of what a restore needs; `expansion`: how much
# larger than its archive a restore grows. Kinds: wordpress_mariadb,
# nextcloud_mariadb, immich_postgres, aistack_archive. Nothing is
# declared on a new installation; for instance:
#
#   recipes:
#     aistack:
#       kind: aistack_archive
#       backup_dir: /media/Backup/AIStack/
#       files_archive: "aistack-*.tar.gz"
#       live_web_container: aistack-web
#       web_timeout_seconds: 180

run_root: /srv/aistack/sandbox
margin_gib: 1
expansion: 4
recipes: {}
