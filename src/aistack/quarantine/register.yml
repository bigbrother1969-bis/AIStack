# OPS-0012 — the quarantine register.
#
# What is here was found unused (2026-10-05: an import graph from every
# entry point — the web application, every CLI, the bundle exporter —
# cross-checked against the tests, the governed documents and the
# architecture the README and ARCH-0010 name). Nothing here is deleted
# yet: each item stays in place until `review_after`, its Python modules
# and scripts carrying a tripwire that records any use
# (reports/generated/quarantine/hits.jsonl).
#
# At the review: an item never used is deleted, with the amendments
# `amend` lists; an item used leaves this register.
#
# Decided by the owner, 2026-10-05: six weeks, the lists A1 and A2 of
# claude/SESSION-2026-10-05-menage-et-estimation.md.

entries:
  - id: Q-001
    paths:
      - src/aistack/item/
      - tests/item/
    reason: >
      The July Item domain (models, lifecycle, metadata, registry):
      imported by nothing but its own test, which pytest does not even
      collect (testpaths: tests/unit and tests/integration).
    since: 2026-10-05
    review_after: 2026-11-16

  - id: Q-002
    paths:
      - src/aistack/catalog/yaml/
      - tests/unit/catalog/yaml/
      - examples/generators/
      - examples/catalogs/
      - examples/__init__.py
      - examples/README.md
    reason: >
      The July Music-Android chain: the example generator is the only
      reader of catalog/yaml, and the smartphone is synchronised by the
      web application since. examples/selections (ignored by git) stays:
      the selection definition reads it.
    since: 2026-10-05
    review_after: 2026-11-16
    amend:
