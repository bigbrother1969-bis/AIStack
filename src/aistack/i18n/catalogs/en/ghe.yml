read_heading: Reading the texts
read_text: 'The reference texts are in the repository: the manifesto (docs/00-foundation/The-Sustainable-Heritage-Manifesto.md), the principles registry (docs/00-foundation/FDN-0012-AIStack-Principles-Registry.md), the constitution (FDN-0003), the governed heritage (FDN-0004) and the guide “Governed Heritage Engineering in AIStack” (docs/04-handbook/GHE-IN-AISTACK.md). This page explains them; where they differ, they prevail. The repositories are listed in “Licence and sources”.'
translation_note: The manifesto was written in French by its author; the repository keeps its English translation, and the labels on this page follow the repository's texts.
