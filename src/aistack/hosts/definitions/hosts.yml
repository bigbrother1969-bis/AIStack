# AIStack — the hosts whose changes AIStack traces (packages, apt runs,
# files of /etc and /usr/local, crontabs, compose projects, systemd
# units).
#
# Each host runs `aistack-host-collector` (deploy/host-collector/ in
# the repository), which writes its records to `directory`: relative to
# AIStack's data directory, or absolute. AIStack only reads them.
# `silent_after_minutes`: a host whose collector has not run for longer
# is said to be silent (the collector's timer runs every 15 minutes).
#
# For example, once the collector is installed on this server:
#
#   hosts:
#     server:
#       directory: hosts/server

silent_after_minutes: 60
hosts: {}
