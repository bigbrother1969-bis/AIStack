# AIStack — how a person signs in (OpenID Connect, with Pocket ID or
# another provider).
#
# `issuer`: the identity provider's address; `public_base_url`:
# AIStack's public address, behind the reverse proxy — both https://,
# without a trailing /. Filled by the installation assistant (/setup,
# step 2). The client's ID and secret, and the fallback administrator's
# password hash, are never written here: the assistant keeps them in
# the data directory (step 3), or `.env.web` names them.
#
# `admin_group`: the provider's group whose members are administrators
# (its name, not its display name).

issuer: "https://id.example.org"
public_base_url: "https://aistack.example.org"
scopes: [openid, profile, email, groups]
client_id_env: AISTACK_OIDC_CLIENT_ID
client_secret_env: AISTACK_OIDC_CLIENT_SECRET
local_admin_env: AISTACK_WEB_ADMIN_SCRYPT
admin_group: aistack_admins
session_idle_hours: 8
session_absolute_days: 7
