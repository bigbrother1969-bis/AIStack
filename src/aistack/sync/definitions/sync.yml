# AIStack — what this server's contents can be sent to, and where
# (Selection UI, ADR-0022).
#
# syncthing: this server's Syncthing (installed by install.sh: it sees
#   the host's /media as /data).
# contents: a directory of this server and the kind of files it holds
#   (audio, images, video, books, comics, documents, any); `exclude`:
#   directories never offered.
# destinations: a device paired with Syncthing (`kind: syncthing`,
#   `device`: its name or its id); `quota_gb`: the room it gives all its
#   contents together.
# pairs: a (content, destination) whose folder already exists elsewhere.
#
# Nothing is declared on a new installation; for instance:
#
#   contents:
#     music:
#       title: {fr: Musique, en: Music}
#       source: /media/Music
#       kind: audio
#   destinations:
#     phone:
#       title: {fr: Téléphone, en: Phone}
#       kind: syncthing
#       device: phone
#       quota_gb: 64

syncthing:
  url: http://127.0.0.1:8384
  api_key_env: SYNCTHING_API_KEY
  timeout_seconds: 5
  path_map:
    /media: /data

contents: {}
destinations: {}
pairs: {}
