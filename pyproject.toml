[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aistack"
version = "0.5.0"
description = "AIStack Knowledge Operating System"
readme = "README.md"
# The interpreter AIStack is verified on.
#
# It was ">=3.11" until 2026-08-23, and three versions were
# declared supported while one was ever run — whichever the
# machine happened to have. That was not free: the contract
# inventory reported 20 orphan contracts on 3.11 and 22 on 3.12
# and 3.13, at the same commit, and it was found because two
# people ran the same command on two machines rather than
# because anything checked (GOV-0002/OS-019).
#
# 3.13 is what the published images run and what the SPOT host
# runs. Narrowing the range gives up a portability nothing
# verified, and `tests/unit/test_declared_interpreter.py` refuses
# to let the claim drift from the interpreter in use.
#
# It caught the agent within the hour. The commit that introduced
# it asserted that 3.13 was also what the owner's laptop ran —
# read off a `python3 -VV` that had in fact executed on the SPOT
# host. The laptop was 3.12, the suite went red on the machine
# that runs it, and the owner aligned the laptop to 3.13 on
# 2026-08-23 rather than widen the range back.
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
]

authors = [
    { name = "Fabrice Persiaut" }
]

license = { text = "AGPL-3.0-or-later" }

# The canonical public location of the Single Point Of Truth.
#
# This is a project fact, identical on every machine, and it is
# already published inside every Context Bundle. It is not a
# machine address: the git remote of a given clone may be a
# tunnel or a loopback, and the export refuses to publish those.
# What the governed test command needs, and did not declare.
#
# `pytest` was configured in this file — `[tool.pytest.ini_options]`
# below, carrying STD-0002's testpaths — and declared as a dependency
# nowhere. It was installed by hand on the laptop, by hand on the
# agent's container, and nothing said which version either had.
#
# ENG-TEST-0002 is C3 and promises reproducibility and deterministic
# execution. An undeclared tool cannot deliver either: two machines
# running the same governed command on the same commit could run two
# pytest versions and nothing would report it. That is the shape of
# GOV-0002/OS-019, where the same measurement gave 20 orphan contracts
# on one interpreter and 22 on another, minus the warning that caught
# it.
#
# A floor, not a pin. There is no lock file yet, so this declares what
# the suite needs rather than what one machine happens to hold —
# recorded under GOV-0002/OS-025 rather than implied.
#
# This table sits after every key of `[project]` on purpose. A TOML
# table header ends the table above it, so placing it beside
# `dependencies` moved `authors` and `license` into it. Caught by
# parsing the file rather than reading it.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "mypy>=1.20",
    "types-PyYAML>=6.0",
]

[project.urls]
Repository = "https://gitea.persiaut-family.fr/fabrice.persiaut/AIStack.git"

[project.scripts]
aistack = "aistack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# STD-0002 (Test Artifact Isolation) says a project's test run
# covers that project's tests and nothing else. It was enforced
# by nobody: a bare `pytest` at the repository root walked into
# `tests/item`, `tests/transaction` and `tests/evidence` — which
# belong to other work that happens to live in this tree — and
# reported 220 passing tests for a project that has 209.
#
# A number nobody can attribute is not a measurement. Declaring
# the paths makes `pytest` and `pytest tests/unit tests/integration`
# the same run, so the standard holds without anyone remembering
# it.
[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
]

# STD-0002 (Test Artifact Isolation) declares `testpaths` below so a
# bare `pytest` and the governed run are the same command, "so the
# standard holds without anyone remembering it" — that reasoning had
# never been extended to `ruff`/`mypy` themselves, and it showed:
# `ruff check .` and `mypy .`, run from the repository root on
# 2026-09-11 for the first time in this project's history, both found
# real findings that every prior "0 issue" report had never actually
# seen, because every prior run had been typed by hand with whatever
# scope happened to be on the command line that day.
#
# `archive/` is explicitly frozen heritage (`GH-0002B: archive AIStack
# V0 heritage components`, 2026-07-06) — components the project keeps
# for record, not code anyone maintains or ships. Linting it the same
# way as live code would ask someone to fix a historical snapshot,
# which defeats the point of archiving it; excluding it here is the
# declared decision, not a scope nobody chose.
[tool.ruff]
extend-exclude = ["archive"]

# Adopted 2026-09-10, after evaluating both against this codebase:
# on the very first run, before any of this configuration existed,
# mypy found two real defects (an incompatible method override in
# ContractRegistry, and two builders passing a list where Catalog
# declares a tuple — both fixed the same day) and ruff found a
# genuine zip() truncation risk and four regex-escaping ambiguities
# in test assertions.
#
# `select` names only what stayed worth seeing on every future
# patch, not everything ruff can check. A first pass with a fuller
# rule set (import sorting, line length, Python-3.11-to-3.13
# modernization idioms) returned 328 findings, and all but a
# handful were mechanical, one-time noise rather than ongoing
# signal — the kind a bulk `--fix` clears once, not the kind a gate
# should hold a future patch to. Complexity (`C90`) is deliberately
# not selected yet either: three functions already exceed the
# default threshold, and deciding whether to refactor them or raise
# the threshold is its own decision, not a side effect of adopting
# a linter. Revisit either omission as a separate, named choice —
# not by widening `select` quietly.
[tool.ruff.lint]
select = ["F", "B", "RUF043"]
# B011 (`assert False` instead of `raise AssertionError()`) and B024
# (an ABC with no abstract method) are both a deliberate idiom this
# heritage already uses throughout its own contract tests —
# `ArtifactBuilder()` must refuse instantiation, and the test states
# that by asserting the attempt never returns. Ignored here rather
# than rewritten, since rewriting would touch a dozen files for a
# style preference this project already settled the other way.
ignore = ["B011", "B024"]

# `selection_ui/app.py`'s own `/save` route takes `Form(default=[])`
# as an argument default — FastAPI's own idiom: the marker object
# *is* the declaration that a field is form data, not a mutable
# default a caller could corrupt (`fastapi.Form` returns a fresh,
# framework-owned object each call; it does not accumulate state the
# way `def f(x=[])` genuinely risks). B008 has no way to tell that
# apart from the real hazard it exists to catch, so `Form` is named
# here as one of the calls this project has actually decided are
# safe in that position — not a blanket disabling of B008 itself,
# which stays selected and catches every other case.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form"]

# python_version pins mypy's own understanding of the language to
# what `pyproject.toml`'s own `requires-python` already declares —
# the same reasoning `requires-python` itself carries above: one
# declared version, checked, rather than whichever interpreter a
# machine happens to have.
#
# `files` is what STD-0002 already declares for pytest as
# `[tool.pytest.ini_options] testpaths`, extended to mypy: "a
# project's [check] covers that project's [code] and nothing else."
# `mypy .`, run unscoped from the repository root for the first time
# in this project's history on 2026-09-11 (after `archive/`'s and
# `build/`'s duplicate-module conflicts — see git history — stopped
# blocking it from finishing), swept into `tests/`, `examples/`,
# `tools/qualification_runner.py`, `priority_ui/` and `selection_ui/`
# and returned 67 findings there, in 29 files, none of them in
# `src/aistack/` itself (`mypy src/aistack` alone was already clean).
# The owner's own choice, given that finding: mypy checks the package
# this project ships, `src/aistack/`, declared here rather than left
# to whatever scope a command line happens to carry — the rest is a
# deliberate, named exclusion, not an oversight, exactly as `archive/`
# already was one line up. `archive/` and `build/` need no exclusion
# of their own any more: `files` never walks into either.
#
# **The governed command is `mypy`, with no path argument.** A path
# given on the command line overrides `files` here entirely — `mypy
# .` still walks the whole repository, `archive/`/`build/` conflicts
# and all, exactly as before this section existed. Confirmed both
# ways 2026-09-11: bare `mypy` matches `mypy src/aistack` findings
# exactly; `mypy .` does not.
[tool.mypy]
python_version = "3.13"
files = ["src/aistack"]

# GOV-0002/OS-056, 2026-09-10. `[tool.setuptools.packages.find]`
# above discovers Python modules; it says nothing about anything
# else, and until this line nothing did. A real, non-editable
# `pip install .` — what `Dockerfile` runs, deliberately, so
# `importlib.metadata` can answer (`test_the_image_declares_what_it_
# ships.py`) — silently built a wheel with every `.py` file and not
# one `.yml` or `.js`: `resource_priority.yml`,
# `service_categorization.yml`, and the mermaid.js this same patch
# vendors were all absent, and every reader that opens one by a
# `Path(__file__)`-relative path (`resource_priority_monitor.py`'s
# `DEFAULT_DEFINITION`, `renderers/architecture/html.py`'s
# `load_vendored_mermaid_js`) would raise `FileNotFoundError` the
# first time it ran from an installed image rather than an editable
# checkout.
#
# Found only because vendoring a new data file for J2 step 5 raised
# the question of whether the existing ones were even packaged —
# an editable install (`pip install -e .`, what every developer and
# this session's own verification clones run) can never surface
# this: it points straight at `src/`, where the files already exist
# regardless of what setuptools declares.
[tool.setuptools.package-data]
aistack = ["**/*.yml", "**/*.js"]
