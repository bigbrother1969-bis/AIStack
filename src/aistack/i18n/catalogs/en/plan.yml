# Action plan — what to do first to raise the health score and reduce
# the technical debt, ranked by gain (the owner's request, 2026-10-08).

title: "AIStack — Action plan"
heading: "Action plan"
intro: "What to do first, ranked by what each action gains, computed from the same findings and the same weights as the two scores. Nothing is applied from this page: it says what to do, where, and opens the AI assistant for each finding."
generated: "Computed at the Health cockpit's last run."
health_heading: "Raise the health score"
health_now: "Health score: {value}/100 ({bucket})."
health_none: "Nothing to fix: no measured domain carries a finding."
health_unavailable: "Health score not computed — {note}"
debt_heading: "Reduce the technical debt"
debt_now: "Technical debt: {value}/100 ({bucket}). Each group carrying debt takes {weight} points off, once."
debt_none: "No technical debt: nothing to do."
debt_unavailable: "Technical debt not computed — {note}"
gain: "+{points} points once this domain has no finding"
gain_zero: "Fixing this domain does not change the score on its own."
gain_one: "+{points} from the first finding fixed."
gain_one_zero: "One finding fixed alone changes nothing while the domain keeps enough to stay at zero: fix them all."
debt_gain: "+{points} points once this group carries no debt"
waiting: "Nothing to do now: the quarantine settles at its review date."
how: "How:"
findings: "{count} finding(s)"
diagnose: "Diagnose with the AI assistant"
back_to_health: "See the Health cockpit"
group:
  quarantine: "Code in quarantine"
how_to:
  storage: "Free some space on the mount point shown, or raise its threshold in ./config/storage_thresholds.yml if the value is normal (OPS-0005)."
  services: "Read the container's logs (docker logs) to see why it restarts or is unhealthy, then fix and restart it; the AI assistant guides you step by step."
  backup: "Check the backup job runs (systemctl list-timers, journalctl) and writes to the path declared in ./config/backup_thresholds.yml (OPS-0006)."
  gpu: "Check the GPU's load, memory and temperature (nvidia-smi); raise the threshold in ./config/gpu_thresholds.yml if the value is normal (OPS-0007)."
  pra_tests: "Run a real restore test of the service, then record it in ./config/pra_tests.yml (status, date, rto_minutes). For WordPress: python -m aistack.cli.sandbox restore wordpress, which proposes the entry (manual, \"Testing a service's restore in a sandbox\"). For AIStack itself: python -m aistack.cli.sandbox restore aistack, or scripts/restore_aistack.sh (manual, \"Backing up and restoring AIStack\")."
  uncovered_state: "Declare how the service is backed up in ./config/backup_strategy.yml (OPS-0010), or set up a backup if it has none."
  inventory_gap: "Declare the container in ./config/service_categorization.yml, mark it on_demand: true if it only runs on demand, or stop it if it should not run (OPS-0011)."
  hosts: "On the host: systemctl status aistack-host-collector.timer, then journalctl -u aistack-host-collector; for the Raspberry, also check /media/BACKUP is mounted on both sides. python -m aistack.cli.hosts gives each host's last write (ADR-0020)."
  quarantine: "Unused code is deleted at the review; an item that was used leaves the quarantine. The detail: python -m aistack.cli.quarantine_report (OPS-0012)."
  other: "Read the fix proposed for each finding; the AI assistant guides you step by step."
tooltip:
  back_to_health: "Open the Health cockpit: every domain and its findings in detail"
  diagnose: "Open this finding in the troubleshooting assistant, on the local network"
  badge: "Open the action plan: what to do first, and what it gains"
