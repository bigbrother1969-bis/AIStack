help:
  title: "AIStack — Help: terminal and SSH"
  back: "← Back to the troubleshooting assistant"
  heading: "Open a terminal and connect over SSH"
  intro: "A small cheat sheet, written by hand — not generated by AI, so as to invent nothing (the exact commands come from real use observed during previous AIStack sessions)."
  terminal_heading: "1. Open a terminal on your computer"
  terminal_before: "On Linux, the shortcut"
  terminal_after: "opens a terminal in most desktop environments (including Cinnamon, used by Linux Mint). If it does nothing on your machine, look for “Terminal” in the applications menu."
  find_heading: "2. Find GIGABYTE on your local network"
  find_address: "Address observed during this session:"
  find_note_before: "This address may change if your router reassigns addresses (DHCP) — it is not guaranteed for life. If it no longer answers, first try the name"
  find_note_after: "instead of the address; otherwise, check the list of connected devices in your router's interface."
  ssh_heading: "3. Connect over SSH"
  ssh_from: "From the terminal opened in step 1:"
  ssh_replace_before: "(replace the address with the one you found in step 2 if it changed, or try"
  ssh_replace_middle: "). The password of the account"
  ssh_replace_after: "on GIGABYTE is then asked for — nothing shows on screen while you type, which is normal with SSH, not a bug."
  paste_heading: "4. Copy and paste a command"
  paste_before: "To paste in most Linux terminals:"
  paste_keys: "Ctrl+Shift+V"
  paste_middle: "(on its own,"
  paste_after: "usually does not paste in a terminal — it sometimes types a character instead). Otherwise, a right click often offers “Paste” directly."
  copy_before: "To copy: select the text with the mouse, then"
  copy_keys: "Ctrl+Shift+C"
  copy_after: ", or right click → “Copy”."
