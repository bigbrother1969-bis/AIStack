    heading: "The host and its ports"
    text: "This host's name on the local network, the public port (behind your reverse proxy) and the local-network port. Keep \"phase: development\" while setting up."
  authentication:
    heading: "The identity provider and the public address"
    text: "Your Pocket ID's address (issuer), AIStack's public address and the name of the administrators' group."
  sign_in_secrets:
    heading: "The OpenID Connect client"
    text: "The ID and secret of the client created in Pocket ID. Without them nobody can sign in. Append them to .env.web without displaying them, then chmod 600 .env.web."
  fallback_secret:
    heading: "The fallback account"
    text: "The fallback administrator's password, which lets you in on the local network when Pocket ID does not answer: python -m aistack.cli.web_admin_password (with Docker: docker compose exec web python -m aistack.cli.web_admin_password), then append the printed line to .env.web."
