services:

  # The core image is a one-shot tool, not a service.
  #
  # Its command validates a published Context Bundle and exits:
  # 0 when the projection is sound, 1 on a blocking finding,
  # 2 when the bundle cannot be found.
  #
  # Until 2026-08-21 the command printed a line and slept for a
  # hundred hours, which is what `restart: unless-stopped` and a
  # healthcheck were written for. Replacing the command with the
  # validator made both wrong: a container that exits at once and
  # is restarted for ever is a loop, not a service.
  #
  # The image carries no bundle. Mount the one to validate:
  #
  #   docker compose run --rm aistack-core
  #
  # or point it at another projection:
  #
  #   docker run --rm -v "$PWD/context/bundles:/app/bundles:ro" \
  #     aistack/core:local \
  #     python -m aistack.cli.knowledge_integrity \
  #     /app/bundles/AIStack-Context-Bundle.zip
  #
  # ---------------------------------------------------------------
  # Published images, pinned by digest so a record is not a label
  # someone can move. OPS-0002 § *Publishing an image* governs the
  # act; this is where it is recorded.
  # ---------------------------------------------------------------
  #
  # **0.7.0 — published 2026-09-12, current.**
  #
  #   bigbrother1969/aistack-core:0.7.0
  #   @sha256:61a18a664a2e41d22c2e682b1cc0d1e0d09e57806c2b92f3cde44f091013c5ba
  #
  # Built from 0f511b6 on the reference host, behind the four terms
  # OPS-0002 § *Publishing an image* requires: a clean tree, `main`,
  # HEAD equal to origin/main, and 1751 tests with `clean: True`.
  # 73 artifacts, 16 checks. Before the build, 0.6.0 was re-verified
  # against its recorded digest (`GOV-0002/OS-047`) — pull matched.
  # Freezes `claude/PLAN-J11-CONSOLE-2026-09-11.md` §10 and §11, all
  # shipped the same day as 0.6.0 without the version ever moving:
  # the Docker dependency graph, external network topology and
  # hardware inventory, live Beszel metrics — all three new sections
  # of `architecture.html` — plus network-wide Docker discovery over
  # SSH and the LAN-only screen managing its candidate usernames,
  # linked from the console.
  #
  # **0.6.0 — published 2026-09-12.**
  #
  #   bigbrother1969/aistack-core:0.6.0
